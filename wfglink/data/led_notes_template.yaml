# Notes for the LED turntable test: python -m wfglink validate --suite led
#
# Copy this file to data/raw/led_notes.yaml and fill in every value in sitting 1.
# Keep the key names exactly as they are. Text after # is a comment and is ignored.
# A value left empty is reported as missing, with an example of what to write.

# The dashcam, as set in its menu ---------------------------------------------------------
dashcam_model:      # brand and model from its label, in quotes, for example "brand model"
file_type:          # the file type it writes: mp4, mov, ts or avi
resolution:         # recording resolution, for example 1920x1080
fps:                # frame rate, for example 30
date_stamp:         # off, or where the date and time sit in the picture:
                    #   top-left, top-right, bottom-left, bottom-right, top or bottom
                    #   (or a box [x0, y0, x1, y1] in fractions of the frame, for example [0.0, 0.9, 0.6, 1.0])
                    # That region is masked from detection in every clip.
wdr_hdr:            # WDR or HDR: on, off or auto

# The rig -------------------------------------------------------------------------------------
camera_height_cm:   # height of the dashcam lens above the LEDs, in cm, for example 40
led_radius_mm:      # distance of each LED from the turntable centre, in mm, for example [30, 80, 140]

# The stopwatch -------------------------------------------------------------------------------
turns_timed:        # how many turns you timed at each speed, for example 30
time_33rpm_s:       # stopwatch seconds for those turns at 33 rpm, for example 54.0
time_45rpm_s:       # stopwatch seconds for those turns at 45 rpm, for example 40.0

# Optional --------------------------------------------------------------------------------------
# ruler_rpm: 0          # turntable speed during the ruler clip: 33, 45, or 0 if it stood still
# ruler_px_per_mm: 2.4  # pixels per mm, only if someone read it off the ruler still
# comment: ""           # anything else worth knowing
