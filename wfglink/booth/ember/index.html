<style>
/* "Become an ember": one phone screen, one glowing ember. Everything is in this file, so the page
   works from any static host or from file:// and makes no network request. */
:root {
  color-scheme: dark;
  background: #000;
  /* The ember's diameter: 2 x 0.36 x the shorter side of the screen (the booth's synthetic phones match it). */
  --ember: 72vmin;
}
@supports (width: 1dvmin) {
  :root { --ember: 72dvmin; }   /* the visible screen, with or without the browser's toolbars */
}
html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: #000;
  overscroll-behavior: none;     /* no pull-to-refresh, no rubber band */
}
body {
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  left: 0;
  touch-action: none;            /* no scrolling, no pinch or double-tap zoom */
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  cursor: none;
  color: #fff;
  font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, "Apple SD Gothic Neo",
    "Noto Sans KR", "Noto Sans CJK KR", "Malgun Gothic", "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}

/* The ember: a soft radial glow, no hard edge. */
.stage {
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  left: 0;
  display: grid;
  place-items: center;
  pointer-events: none;
  animation: ignite 0.9s ease-out both;
}
.glow, .ember {
  width: var(--ember);
  height: var(--ember);
  will-change: opacity, transform;
  animation-timing-function: ease-in-out;
  animation-iteration-count: infinite;
}
.glow { animation-name: drift; animation-duration: 5.3s; }
.ember {
  border-radius: 50%;
  background: radial-gradient(circle closest-side,
    #FFF1D6 0%, #FFC266 18%, #FF8A1F 45%, rgba(255, 90, 0, 0.35) 70%, rgba(255, 90, 0, 0) 100%);
  animation-name: flicker;
  animation-duration: 3.3s;
}
/* Flicker: brightness (opacity over black) and size move together, smoothly, at about 3 Hz.
   flicker spans 0.89 to 1.0 in brightness and 0.98 to 1.0 in scale; the slow drift spans 0.975 to 1.0
   and 0.99 to 1.0. Together they stay inside brightness 0.85 to 1.0 and scale 0.97 to 1.0. */
@keyframes flicker {
  0%    { opacity: 1;     transform: scale(1); }
  5.3%  { opacity: 0.945; transform: scale(0.991); }
  11.2% { opacity: 0.977; transform: scale(0.996); }
  15.3% { opacity: 0.89;  transform: scale(0.98); }
  18.3% { opacity: 0.995; transform: scale(0.999); }
  24.3% { opacity: 0.923; transform: scale(0.987); }
  28.4% { opacity: 0.978; transform: scale(0.996); }
  32.3% { opacity: 0.922; transform: scale(0.987); }
  37.2% { opacity: 0.987; transform: scale(0.998); }
  43.9% { opacity: 0.94;  transform: scale(0.99); }
  49.2% { opacity: 1;     transform: scale(1); }
  53%   { opacity: 0.908; transform: scale(0.985); }
  58.2% { opacity: 0.971; transform: scale(0.995); }
  61.4% { opacity: 0.926; transform: scale(0.988); }
  66.1% { opacity: 0.998; transform: scale(1); }
  71.4% { opacity: 0.89;  transform: scale(0.98); }
  76.3% { opacity: 0.977; transform: scale(0.996); }
  79.3% { opacity: 0.89;  transform: scale(0.98); }
  84.9% { opacity: 0.976; transform: scale(0.996); }
  89.3% { opacity: 0.9;   transform: scale(0.983); }
  95.3% { opacity: 0.975; transform: scale(0.996); }
  100%  { opacity: 1;     transform: scale(1); }
}
@keyframes drift {
  0%    { opacity: 1;     transform: scale(1); }
  12.4% { opacity: 0.982; transform: scale(0.994); }
  20.6% { opacity: 0.998; transform: scale(0.999); }
  32%   { opacity: 0.975; transform: scale(0.99); }
  42.3% { opacity: 0.998; transform: scale(0.999); }
  50.3% { opacity: 0.975; transform: scale(0.99); }
  60.2% { opacity: 0.996; transform: scale(0.999); }
  74%   { opacity: 0.979; transform: scale(0.993); }
  88.9% { opacity: 0.998; transform: scale(0.999); }
  100%  { opacity: 1;     transform: scale(1); }
}
@keyframes ignite {
  from { opacity: 0; }
  to   { opacity: 1; }
}
/* Reduced motion: a gentler shimmer, no change in size. */
@media (prefers-reduced-motion: reduce) {
  .glow { animation: none; }
  .ember { animation-name: shimmer; animation-duration: 4.1s; }
}
@keyframes shimmer {
  0%, 100% { opacity: 1; }
  23%      { opacity: 0.96; }
  41%      { opacity: 0.99; }
  67%      { opacity: 0.95; }
  84%      { opacity: 0.985; }
}

/* Instructions: shown over a dimmed ember for 3 s, then the ember comes up to full brightness.
   A tap hides them at once. */
.hint {
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  left: 0;
  z-index: 1;
  pointer-events: none;
  transition: opacity 0.35s ease-out;
}
.hint.off { opacity: 0; }
.hint-body {
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  left: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  box-sizing: border-box;
  padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right))
           max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
  background: rgba(0, 0, 0, 0.68);
  text-align: center;
  animation: hint-out 0.7s ease-in 3s forwards;
}
.hint-text { animation: hint-in 0.4s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
.hint p { margin: 0 auto; text-wrap: balance; }
.ko {
  max-width: 14em;
  font-size: clamp(19px, 5.6vmin, 30px);
  font-weight: 600;
  line-height: 1.4;
  letter-spacing: -0.01em;
  word-break: keep-all;
}
.en {
  max-width: 19em;
  margin-top: 0.55em !important;
  font-size: clamp(15px, 4.1vmin, 22px);
  line-height: 1.4;
  color: rgba(255, 255, 255, 0.7);
}
.bright {
  margin-top: 1.9em !important;
  font-size: clamp(12px, 3.4vmin, 17px);
  letter-spacing: 0.03em;
  color: #FFC266;
  word-break: keep-all;
}
.bright::before {
  content: "";
  display: block;
  width: 28px;
  height: 1px;
  margin: 0 auto 1.3em;
  background: rgba(255, 194, 102, 0.5);
}
@keyframes hint-in {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: none; }
}
@keyframes hint-out {
  from { opacity: 1; }
  to   { opacity: 0; visibility: hidden; }
}

/* The keep-awake fallback video: 1 px, black on black. */
.awake {
  position: fixed;
  left: 0;
  top: 0;
  width: 1px;
  height: 1px;
  pointer-events: none;
}
