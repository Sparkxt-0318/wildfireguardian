[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wildfireguardian"
version = "0.1.0-alpha"
description = "Wildfire spread forecasting and household-level evacuation and rescue routing, focused on protecting rural elderly Koreans."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "WildfireGuardian Project Contributors" },
]
keywords = [
    "wildfire",
    "fire-spread",
    "rothermel",
    "lfmc",
    "evacuation-routing",
    "korea",
    "disaster-response",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "shapely>=2.0",
    "matplotlib>=3.7",
    "pydantic>=2.0",
    "tqdm>=4.65",
    "rich>=13.0",
    "PyYAML>=6.0",
    # --- Session 18: undeclared runtime imports, found mechanically ----------
    # scripts/check_declared_deps.py walks every tracked .py with `ast`.
    # `affine` is imported lazily inside spread_v2/grid.py; it was present only
    # as a rasterio transitive, and a transitive is not a declaration.
    "affine>=2.3",
    # h5netcdf/h5py are STRING-DISPATCHED — spread_v2/data.py calls
    # xr.open_dataset(..., engine="h5netcdf"), so neither name appears in any
    # import statement. Nothing but an `engine=` scan can find them.
    "h5netcdf>=1.0",
    "h5py>=3.0",
]

[project.optional-dependencies]
geospatial = [
    "geopandas>=0.13",
    "rasterio>=1.3",
    "xarray>=2023.1",
    "pyproj>=3.5",
    "folium>=0.14",
]
ml = [
    "scikit-learn>=1.3",
]
routing = [
    "networkx>=3.0",
    "osmnx>=1.6",
]
# xgboost is required ONLY by the abandoned spread_v2_xgb (Build A) and the LFMC
# scaffold — NOT by the canonical spread_v2 model (sklearn HistGradientBoosting).
# Kept out of `ml` so installing the canonical stack does not pull it in.
legacy = [
    "xgboost>=2.0",
    # engine="netcdf4" in spread_v2_xgb/era5.py — string-dispatched, Build A only
    "netCDF4>=1.6",
]
dev = [
    "pytest>=7.4",
    "jupyter>=1.0",
    "pillow>=10.0",
    # scripts/measure_fonts.py and tests/test_screen_checks.py; was present only
    # as a matplotlib transitive
    "fonttools>=4.40",
]
# ERA5 download only. NOT needed to run the demo, which reads committed
# snapshots — scripts/get_era5.py is how those snapshots were made.
acquisition = [
    "cdsapi>=0.7",
]
# Real SMS delivery. delivery/sms.py imports twilio ONLY after finding provider
# credentials in the environment; with none present it returns
# {"sent": False, "reason": "provider credentials absent"} without importing.
sms = [
    "twilio>=9.0",
]

[project.urls]
Homepage = "https://github.com/sparkxt-0318/wildfireguardian"
Repository = "https://github.com/sparkxt-0318/wildfireguardian"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"
