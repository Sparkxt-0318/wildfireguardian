[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wildfireguardian"
version = "0.1.0-alpha"
description = "Multi-scale wildfire forecasting and personalized evacuation system, focused on protecting rural elderly Koreans."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "WildfireGuardian Project Contributors" },
]
keywords = [
    "wildfire",
    "fire-spread",
    "rothermel",
    "lfmc",
    "evacuation-routing",
    "korea",
    "disaster-response",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "shapely>=2.0",
    "matplotlib>=3.7",
    "pydantic>=2.0",
    "tqdm>=4.65",
    "rich>=13.0",
]

[project.optional-dependencies]
geospatial = [
    "geopandas>=0.13",
    "rasterio>=1.3",
    "xarray>=2023.1",
    "pyproj>=3.5",
    "folium>=0.14",
]
ml = [
    "scikit-learn>=1.3",
    "xgboost>=2.0",
]
routing = [
    "networkx>=3.0",
    "osmnx>=1.6",
]
dev = [
    "pytest>=7.4",
    "jupyter>=1.0",
    "pillow>=10.0",
]

[project.urls]
Homepage = "https://github.com/sparkxt-0318/wildfireguardian"
Repository = "https://github.com/sparkxt-0318/wildfireguardian"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"
