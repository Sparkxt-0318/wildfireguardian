[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hazard-contract"
version = "1.0.1"
description = "WildfireGuardian hazard_contract v1: K-member raster fire scenario sets and conservative segment hazard queries"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=1.26", "pydantic>=2.7,<3"]

[project.optional-dependencies]
test = ["pytest>=8", "hypothesis>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
