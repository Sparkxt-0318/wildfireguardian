# wfg-roadlayer 기본 설정 / default settings.
# 복사해서 고친 뒤 --settings 파일경로 로 넘기십시오. Copy, edit, and pass with --settings PATH.
# 이 값들은 출력의 run.json 과 모든 PDF 하단에 그대로 기록됩니다. The values are recorded in run.json and on every sheet.

[stage]
# 화재 도달까지 남은 시간(시간)이 이 값 이하이면 해당 단계. Hours until fire arrival at or below which the stage applies.
# 준비(Prepare) = 실행대기 기준보다 많이 남음.
standby_hours = 8      # 실행대기 / standby
immediate_hours = 5    # 즉시 실행 / execute now

[routing]
shelters_per_village = 3   # 직선거리로 가장 가까운 대피소 수 (진입 지점이 서로 다른 것). Nearest shelters (distinct entry nodes).
dwell_s = 120              # 대피소 도착 후 머무는 시간(초). Seconds a vehicle must stay at the shelter after arrival.

[freshness]
# 이 한도를 넘으면 숫자를 내지 않습니다. Beyond these limits the tool refuses to output numbers.
max_fire_input_age_min = 90    # 기준 시각(as-of) - 발표 시각. as-of minus issue time.
max_issue_ahead_min = 5        # 발표 시각이 기준 시각보다 앞선(미래) 허용치. Issue time may lead as-of by this much.
max_road_age_days = 365        # 발표 시각 - 도로망 스냅샷 시각. Issue time minus road-graph snapshot.
max_places_age_days = 365      # 발표 시각 - 마을·대피소 자료 시각. Issue time minus places/shelters snapshot.

[run]
workers = 0   # 병렬 프로세스 수, 0 = CPU 수(최대 8). Worker processes, 0 = CPU count (at most 8).

[heat]
# 복사열 도로 폐쇄 (research/kcf-radiation, 공개된 방법). Radiant-heat road closure by published methods
# (research/kcf-radiation METHOD.md). 0 = 끔 / off (기본값 / default), 1 = 켬 / on (or --heat).
enabled = 0
threshold_kw_m2 = 4.7  # 이 복사열(kW/m²)을 넘으면 도로를 닫음. Flux at which a road piece closes: 7, 4.7 (default) or 2.5.
fuel_level = 1         # 연료량 0 낮음 / 1 중간 / 2 높음. Fuel load 0 low / 1 middle / 2 high (METHOD.md table 3).
wind10_m_s = 7.0       # 10 m 풍속 (불꽃 기울기). 10 m wind for flame tilt; ASSUMED ~90th percentile of ECMWF wind at arrival, Uiseong 2025.
rh_pct = 30.0          # 상대습도 (대기 투과율). Relative humidity for transmissivity; ASSUMED.
air_temp_c = 10.0      # 기온. Air temperature; ASSUMED.
