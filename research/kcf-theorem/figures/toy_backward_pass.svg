<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 596" width="1240" height="596" font-family="Helvetica, Arial, sans-serif" font-size="12">
<defs><pattern id="fl" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#fde2e1"/><line x1="0" y1="0" x2="0" y2="6" stroke="#d64541" stroke-width="2.5"/></pattern><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
<rect width="1240" height="596" fill="#ffffff"/>
<text x="20" y="28" font-size="16" font-weight="bold">Backward pass on the 6-node toy (H = 60 s), as executed by deadline_field.core.backward</text>
<text x="20" y="48" fill="#444">Each row is one heap pop: a piece of G_j is shifted back by the travel time D_j, the seconds at which edge j is closed (B_j) are removed,</text>
<text x="20" y="64" fill="#444">and what is left is added to R_s for every edge s into tail(j). Pops that have no predecessor (edges out of the origin) are omitted.</text>
<text x="20" y="130" font-weight="bold">Road graph</text>
<g transform="translate(0,160)">
