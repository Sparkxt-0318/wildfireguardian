   <g id="text_1">
    <text style="font-weight: 700; font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: start" x="43.2" y="38.88" transform="rotate(-0 43.2 38.88)">Route search and checking under a frozen contract</text>
   </g>
   <g id="text_2">
    <text style="font-size: 10.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #4d5964" x="43.2" y="66.96" transform="rotate(-0 43.2 66.96)">Illustrative current-law workflow • latest c651 inputs / kit v3 • not a measured trajectory</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 10.9px; font-family: 'DejaVu Sans'; text-anchor: start" x="51.84" y="127.44" transform="rotate(-0 51.84 127.44)">1  Bind inputs and admission</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(51.84 165.383437)">Forecast, scenario, graph and clock identities</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(51.84 181.583437)">Native masks and zero policies</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(51.84 197.783437)">Origin, supplied history and mission requirements</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 10.9px; font-family: 'DejaVu Sans'; text-anchor: start" x="311.04" y="127.44" transform="rotate(-0 311.04 127.44)">2  Search timed journeys</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(311.04 165.383437)">Legal road motion, turns and waits</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(311.04 181.583437)">Time / incoming-edge state and scenario dose</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(311.04 197.783437)">Witnesses and bounded search stages</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 10.9px; font-family: 'DejaVu Sans'; text-anchor: start" x="570.24" y="127.44" transform="rotate(-0 570.24 127.44)">3  Check the full journey</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(570.24 165.383437)">Flame contact, peak flux and dose</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(570.24 181.583437)">Incurred exposure and destination dwell</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(570.24 197.783437)">Runtime road certificate gates publication</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 10.9px; font-family: 'DejaVu Sans'; text-anchor: start" x="570.24" y="301.68" transform="rotate(-0 570.24 301.68)">4  Record every outcome</text>
   </g>
   <g id="text_10">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(570.24 339.623437)">Route or scoped refusal; rejected check</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(570.24 355.823437)">Timeout, unsupported, late and interrupted</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(570.24 372.023437)">Owned-process and complete-cost receipts</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 10.9px; font-family: 'DejaVu Sans'; text-anchor: start" x="311.04" y="301.68" transform="rotate(-0 311.04 301.68)">5  Independent checks within scope</text>
   </g>
   <g id="text_12">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(311.04 339.623437)">Trajectory and exact whole-road flame contact</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(311.04 355.823437)">Cell-centre exposure and optimum / refusal</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(311.04 372.023437)">Road radiation samples are diagnostics</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 10.9px; font-family: 'DejaVu Sans'; text-anchor: start" x="51.84" y="301.68" transform="rotate(-0 51.84 301.68)">6  Report within evidence scope</text>
   </g>
   <g id="text_14">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(51.84 339.623437)">Exact source / input / result binding</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(51.84 356.236172)">Resolution, routes and refusal denominators</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(51.84 372.895312)">Preserve failures and unresolved claims</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start" x="43.2" y="457.2" transform="rotate(-0 43.2 457.2)">Research outcome = recorded result + process receipt + independent check scope</text>
   </g>
   <g id="text_16">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(43.2 473.12875)">Resolved is conditional on the declared model. Runtime road certificates come from the software under test.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(43.2 488.16)">This independent review does not establish a continuous-road radiation enclosure, global proof or physical safety.</text>
   </g>
   <g id="text_17">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #4d5964" transform="translate(43.2 527.52)">Sources: retained routing contracts and exact latest packet / queue reviews (ledger).</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #4d5964" transform="translate(43.2 540.72)">Foundations: Dean (2004); Irnich &amp; Desaulniers (2005); Phillips &amp; Likhachev (2011).</text>
   </g>
  </g>
 </g>
