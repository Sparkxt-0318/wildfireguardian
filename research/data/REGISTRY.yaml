      - "download BLOCKED 2026-09-16, reclassified access from open to request: the file is not hosted on data.go.kr itself. Following data.go.kr's own URL to forest.go.kr's fRMap.do trail page, the actual zip download (/imdo/imdo.zip) is served only through a JS popup (fileDownloadPopup.do) that requires checking '개인정보 수집·이용 동의' (personal information collection/use consent) plus selecting a 활용목적 (purpose of use) before the form submits to insertDownHistory.do. Confirmed server-enforced, not just UI theater: a direct GET of https://www.forest.go.kr/imdo/imdo.zip (bypassing the consent form) returned HTTP 307 to /error.html. This program's scope rules forbid an agent from accepting that consent, so the SHP was never downloaded and the full attribute schema could not be confirmed from the file itself this round; only the portal's generic marketing description (route/coordinate/section/connection-structure attributes, no width, no explicit date field mentioned) is available. See research/reports/A1/2026-09-16_round2.md for the human-gate writeup (new item, not WJ-009, not yet numbered by John) and A3's two questions."
