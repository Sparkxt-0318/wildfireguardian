  - id: naas_soil_map
    title: Soil map (흙토람)
    provider: National Institute of Agricultural Sciences
    url: "verify access and license"
    access: request
    key_env: null
    license: "verify"
    directions: [landslides]
    temporal_coverage: static
    spatial_coverage: South Korea
    crs: "verify"
    files: []
    known_issues: []
    loader: research.shared.loaders.soil.load_soil_map
    status: pending

  - id: kigam_geology_map
    title: Geology map
    provider: KIGAM
    url: "verify access and license"
    access: request
    key_env: null
    license: "verify"
    directions: [landslides]
    temporal_coverage: static
    spatial_coverage: South Korea
    crs: "verify"
    files: []
    known_issues: []
    loader: research.shared.loaders.geology.load_geology_map
    status: pending

  - id: base_map_linear_features
    title: Road, river and ridge vectors
    provider: NGII national base map, OpenStreetMap as fallback
    url: "verify NGII access; https://download.geofabrik.de/asia/south-korea.html for OSM"
    access: request
    key_env: null
    license: "NGII terms to verify; OSM is ODbL"
    directions: [roads]
    temporal_coverage: "verify edition"
    spatial_coverage: South Korea
    crs: "NGII EPSG:5179 or EPSG:5186; OSM EPSG:4326"
    files: []
    known_issues:
      - "ridges are not a base-map layer; they are derived from the DEM, so the derivation must be documented"
    loader: research.shared.loaders.roads.load_linear_features
    status: pending

  - id: vworld_geocoder
    title: VWorld geocoder and parcel lookup
    provider: VWorld (MOLIT)
    url: https://www.vworld.kr/dev/v4dv_geocoderguide2_s001.do
    access: api_key
    key_env: VWORLD_KEY
    license: "verify on the developer page"
    directions: [suppression, roads, landslides]
    temporal_coverage: n/a
    spatial_coverage: South Korea
    crs: EPSG:4326 or EPSG:5186 depending on request
    files: []
    known_issues:
      - "fire locations are addresses; store the geocoding precision level as a column and never mix levels silently"
    loader: research.shared.loaders.vworld.geocode
