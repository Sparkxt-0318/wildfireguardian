    status: pending

  - id: base_map_linear_features
    title: Road, river and ridge vectors
    provider: NGII national base map, OpenStreetMap as fallback
    url: "NGII terms not confirmed 2026-09-16 (map.ngii.go.kr/ms/map/NlipMap.do and map.ngii.go.kr/ both returned HTTP 400 to a page fetch, same result as for dem_korea -- likely the same viewer requires a browser session WebFetch cannot provide); OSM fallback confirmed working: https://download.geofabrik.de/asia/south-korea.html"
    access: request
    key_env: null
    license: "NGII terms not confirmed, see url field. OSM: ODbL 1.0, confirmed 2026-09-16 on the Geofabrik page."
    directions: [roads]
    temporal_coverage: "OSM South Korea extract confirmed 2026-09-16 as current to 2026-09-15 20:20 UTC (rolling extract, always near-current); NGII edition not confirmed"
    spatial_coverage: South Korea
    crs: "NGII EPSG:5179 or EPSG:5186 (not independently confirmed); OSM EPSG:4326, confirmed by format (PBF/Shapefile/GeoPackage all in WGS84 by Geofabrik convention)"
    files: []
    known_issues:
      - "ridges are not a base-map layer; they are derived from the DEM, so the derivation must be documented"
      - "NGII map viewer returned HTTP 400 on two attempts 2026-09-16, same failure mode as dem_korea; logged as a human-gate candidate rather than looped on further"
      - "CHARTER.md (autonomous-loop, not this program) instructs the finals-build loop not to re-acquire Yeongdeok OSM data; that rule is about the frozen finals build under src/wildfireguardian/, not this research program, but any OSM download here should still avoid duplicating that specific extract without checking first"
    loader: research.shared.loaders.roads.load_linear_features
    status: pending

