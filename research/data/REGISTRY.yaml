    directions: [landslides, roads]
    temporal_coverage: "portal shows last registration/modification date 2021-10-21 for the 1:5,000 edition (filename dated 2021-08-31); next scheduled registration 2022-10-21 per the portal, which may mean the listing is stale -- not independently re-verified against a fresher edition"
