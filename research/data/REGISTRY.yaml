# Dataset registry for the WildfireGuardian research program.
#
# One entry per dataset. The acquisition agent (A1) fills `files`, `status` and
# `temporal_coverage` from an actual download, never from the portal blurb.
#
# Field meanings
#   access      open | api_key | request | paid
#   status      pending  nothing fetched yet
#               fetched  bytes on disk with a recorded sha256
#               verified a script in research/data/checks/ passes against it
#               blocked  cannot proceed, with a Waiting-on-John item to match
#   directions  which of roads / landslides / suppression needs it
#   files       list of {path, sha256, bytes, accessed_utc}
#   loader      dotted path to load_<name>() in research/shared/loaders/
#
# Priority order is section 6 of the program brief: priority 1 first.
# Every entry must be Korean in coverage. A non-Korean dataset proposed for
# fitting is a human gate, not an agent decision.

datasets:

  # ------------------------------------------------------------------ P1 ----

  - id: kfs_fire_stats_api
    title: KFS wildfire occurrence statistics (Open API)
    provider: Korea Forest Service
    url: https://www.data.go.kr/data/3070842/openapi.do
    endpoint: https://apis.data.go.kr/1400000/forestStusService/getfirestatsservice
    access: api_key
    key_env: DATA_GO_KR_KEY
    license: "unrestricted (KOGL per portal), confirm on the portal page"
    directions: [suppression]
    temporal_coverage: "TBD: probe query for 1991 to 2001 answers how far back the record goes"
    spatial_coverage: South Korea, address level
    crs: none (addresses)
    files: []
    known_issues: []
    loader: research.shared.loaders.kfs.load_fire_stats
    status: pending

  - id: kfs_fire_stats_csv
    title: 산림청 산불통계데이터 (CSV)
    provider: Korea Forest Service
    url: https://www.data.go.kr/data/15121380/fileData.do
    access: open
    key_env: null
    license: "confirm on the portal page"
    directions: [suppression, roads]
    temporal_coverage: "verified 2026-09-16: 발생일시_년 (report time, KST) ranges 2022 to 2025 across 2020 rows; see research/data/checks/check_kfs_fire_stats_csv.py"
    spatial_coverage: South Korea, address level
    crs: none (addresses)
    files:
      - path: data/raw/kfs_fire_statistics/산림청_산불통계데이터_20250911.csv
        sha256: ae3e8426702168cb288761735dabe5b8a45f429ba7bc13e9f0318e838a92c153
        bytes: 195891
        accessed_utc: "already in the repository before this program started"
    known_issues:
      - "12 negative durations (진화종료시간 earlier than 발생일시), independently re-counted 2026-09-16 and agrees with the program brief's figure of 12; never silently dropped"
      - "2 impossible end years present (진화종료시간_년 = 2055 and 2223), independently counted 2026-09-16; 발생일시_년 for these two rows is 2025 and 2023 respectively"
      - "발생일시 is a reported start time, not observed ignition; every duration is report-to-containment"
      - "portal ships CP949/EUC-KR, not UTF-8 (confirmed: UTF-8 decode fails on this file)"
      - "13 nulls in 발생장소_시군구, 307 nulls in 발생장소_읍면, 1 null in 발생장소_동리, 294 nulls in 발생원인_구분 (independently counted 2026-09-16)"
    loader: research.shared.loaders.kfs.load_fire_stats_csv
    status: verified

  - id: kfs_fire_state_history_csv
    title: 산림청 산불상태이력 (CSV)
    provider: Korea Forest Service
    url: https://www.data.go.kr/data/15121205/fileData.do
    access: open
    key_env: null
    license: "confirm on the portal page"
    directions: [suppression, roads]
    temporal_coverage: "TBD: confirm from the file"
    spatial_coverage: South Korea, address level
    crs: none (addresses)
    files: []
    known_issues:
      - "the sunrise and sunset columns are a single national value, not local; never use them, compute local solar times from coordinates instead"
      - "41 negative durations, to be flagged and counted"
      - "Uiseong 2025 appears as two same-day records (52,707 ha and 46,575 ha); apply the K-SPREAD complex rule"
    loader: research.shared.loaders.kfs.load_fire_state_history
    status: pending

  - id: firms_active_fire_korea
    title: NASA FIRMS active fire archive over Korea (VIIRS SNPP, NOAA-20, NOAA-21)
    provider: NASA FIRMS / LANCE
    url: https://firms.modaps.eosdis.nasa.gov/api/area/
    access: api_key
    key_env: FIRMS_MAP_KEY
    license: "NASA open data, attribution required"
    directions: [roads, suppression]
    temporal_coverage: "all dates of the five study fires: Goseong 2019, Uljin 2022, Gangneung 2023, Uiseong 2025, Sancheong 2025"
    spatial_coverage: South Korea bounding box
    crs: EPSG:4326
    files: []
    known_issues:
      - "375 m fire radiative power saturates at intense fronts; do not use it as an intensity measure there"
      - "Suomi NPP delivery ends 2026-11-01; NOAA-20/21 are the forward-looking products"
    loader: research.shared.loaders.firms.load_active_fire
    status: pending

  - id: sentinel2_l2a_dnbr
    title: Sentinel-2 L2A scenes for pre- and post-fire dNBR
    provider: ESA Copernicus / Microsoft Planetary Computer
    url: https://dataspace.copernicus.eu/
    access: api_key
    key_env: COPERNICUS_USER
    license: "Copernicus open licence"
    directions: [roads, landslides]
    temporal_coverage: "pre and post windows for the five study fires, plus pre and post July 2025 for Sancheong"
    spatial_coverage: South Korea, scene level
    crs: EPSG:32652 (native UTM), reproject to EPSG:5186 for analysis
    files: []
    known_issues: []
    loader: research.shared.loaders.sentinel2.load_scene
    status: pending

  - id: dem_korea
    title: DEM for slope, aspect and slope units
    provider: NGII 5 m if obtainable, else Copernicus GLO-30
    url: "NGII terms could not be confirmed 2026-09-16 (map.ngii.go.kr/ms/map/NlipMap.do and map.ngii.go.kr/ both returned HTTP 400 to a page fetch; www.ngii.go.kr content page carried no procedural detail); fallback confirmed working: https://dataspace.copernicus.eu/explore-data/data-collections/copernicus-contributing-missions/collections-description/COP-DEM"
    endpoint: "Copernicus GLO-30: registration required (free for research institutions and public authorities; general public gets free view plus GLO-30 download), via dataspace.copernicus.eu, key_env COPERNICUS_USER/COPERNICUS_PASS"
    access: request
    key_env: null
    license: "GLO-30 fallback: free worldwide licence, DOI citation required (https://doi.org/10.5270/ESA-c5d3d65), confirmed 2026-09-16. NGII 5 m licence not confirmed: the portal did not state it on the pages reached."
    directions: [roads, landslides]
    temporal_coverage: static
    spatial_coverage: South Korea
    crs: EPSG:5186 after reprojection
    files: []
    known_issues:
      - "never mosaic two DEM providers (HANDOFF_ROUND3 section 5 rule 17)"
      - "NGII 5 m DEM access route not confirmed as of 2026-09-16; two portal pages returned HTTP 400 or no procedural detail (see url field). Logged as a human-gate candidate rather than looped on further."
      - "GLO-30 is 30 m, coarser than the NGII 5 m target; using it changes the slope-unit resolution and that tradeoff must be stated wherever it is used"
    loader: research.shared.loaders.dem.load_dem
    status: pending

  - id: kfs_forest_type_map
    title: 임상도 KFS forest type map (pine versus broadleaf)
    provider: Korea Forest Service (산림청)
    url: "https://www.data.go.kr/data/15093362/fileData.do (confirmed 2026-09-16: 산림청_임상도(산림공간정보 1:5000)_08/31/2021, SHP file download; a coarser 1:25,000 edition also exists at https://www.data.go.kr/data/3045619/fileData.do)"
    access: open
    key_env: null
    license: "공공저작물 : 출처표시, 변경금지 (제 3유형) = KOGL Type 3, attribution required, NO MODIFICATION -- confirmed on the portal page 2026-09-16. Flag before deriving any product from this layer; KOGL-3 restricts modification of the work itself, confirm interpretation before redistributing a derived layer."
    directions: [landslides, roads]
    temporal_coverage: "portal shows last registration/modification date 2021-10-21 for the 1:5,000 edition (filename dated 2021-08-31); next scheduled registration 2022-10-21 per the portal, which may mean the listing is stale -- not independently re-verified against a fresher edition"
    spatial_coverage: South Korea
    crs: "not stated on the portal page reached; verify from the SHP itself once downloaded"
    files: []
    known_issues:
      - "KOGL Type 3 licence forbids modification of the work; using it to derive a pine/broadleaf covariate needs a documented reading of what counts as modification versus analytical use, before any derived layer is shared"
    loader: research.shared.loaders.forest.load_forest_type
    status: pending

  - id: kfs_forest_roads
    title: Forest road network with width attributes
    provider: Korea Forest Service (산림청)
    url: "https://www.data.go.kr/data/3045621/fileData.do (confirmed 2026-09-16: 산림청_임도망도(산림공간정보)_20200914, SHP file download)"
    access: open
    key_env: null
    license: "\"이용허락범위 제한 없음\" (no usage restrictions stated) -- confirmed on the portal page 2026-09-16"
    directions: [roads]
    temporal_coverage: "filename dated 2020-09-14; portal's most-recent-update field showed 2025-11-20 at the time of this check (2026-09-16), so the file itself may have been refreshed since the 2020 filename -- confirm the actual download's internal date, do not assume 2020"
    spatial_coverage: South Korea
    crs: "not stated on the portal page reached; verify from the SHP itself once downloaded"
    files: []
    known_issues:
      - "confirmed 2026-09-16: the portal description lists route line, coordinate position, section and connection-structure attributes, and does not mention a road-width attribute; if width is missing, derive it from high-resolution imagery on a sample and log the method"
    loader: research.shared.loaders.roads.load_forest_roads
    status: pending

  - id: kma_asos_aws
