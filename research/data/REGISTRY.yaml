    access: request
    key_env: KMA_APIHUB_KEY
    license: "verify"
    directions: [landslides]
    temporal_coverage: "storm windows over the landslide record"
    spatial_coverage: South Korea
    crs: "verify"
    files: []
    known_issues: []
    loader: research.shared.loaders.kma.load_radar_qpe
