<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>차량 출동 재생 · 영덕 2025-03-25</title>
<style>
:root{
  --deep:#0b0f14; --panel:#16202b; --line:#22303f;
  --text:#e8edf2; --sub:#94a3b8; --dim:#7c8ba1;
  --cyan:#22d3ee; --amber:#f59e0b; --red:#f87171; --warn:#fde047; --blue:#2563eb;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--deep);color:var(--text);
  font-family:system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.5}
h1{font-size:19px;margin:0 0 2px}
h2{font-size:15px;margin:0 0 8px;color:var(--sub);letter-spacing:.02em;text-transform:none}
.wrap{max-width:1400px;margin:0 auto;padding:14px}
.banner{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--warn);
  border-radius:6px;padding:10px 12px;margin-bottom:12px;color:var(--text);font-size:13.5px}
.banner b{color:var(--warn)}
.grid{display:grid;grid-template-columns:minmax(360px,1fr) minmax(420px,520px);gap:12px}
@media (max-width:1050px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px;margin-bottom:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
label{color:var(--sub);font-size:13px}
select,button{background:#1e2a38;color:var(--text);border:1px solid var(--line);
  border-radius:5px;padding:7px 11px;font-size:14px;font-family:inherit;cursor:pointer}
button:hover{background:#27354a}
button:focus-visible,select:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
button[disabled]{opacity:.45;cursor:not-allowed}
.btn-ack{border-color:var(--blue)} .btn-arr{border-color:var(--cyan)}
.btn-del{border-color:#35d07f} .btn-abo{border-color:var(--red)}
.stamp{font-size:12px;color:var(--dim);min-height:16px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:top}
th{color:var(--sub);font-weight:600;white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13.5px}
.kv dt{color:var(--sub)} .kv dd{margin:0;font-variant-numeric:tabular-nums}
.big{font-size:28px;font-variant-numeric:tabular-nums;line-height:1.1}
.tag{display:inline-block;border:1px solid var(--line);border-radius:4px;padding:1px 6px;
  font-size:12px;color:var(--sub);margin-right:4px}
.tag.ok{color:#7ee2b8;border-color:#2b5a45} .tag.bad{color:var(--red);border-color:#5a2b2b}
.tag.warn{color:var(--warn);border-color:#5a512b}
.slider{width:100%;margin:6px 0 0}
.ticks{position:relative;height:20px;font-size:11.5px;color:var(--dim)}
.ticks span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.ticks span.doc{color:var(--warn)}
svg{display:block;width:100%;height:auto;background:var(--deep);border:1px solid var(--line);border-radius:5px}
.legend{font-size:12.5px;color:var(--sub);margin-top:6px}
.legend i{display:inline-block;width:11px;height:11px;margin-right:4px;vertical-align:-1px;border-radius:2px}
.foot{font-size:12.5px;color:var(--dim);margin-top:10px}
.foot ul{margin:6px 0 0 18px;padding:0}
.sheet{display:none}
@media print{
  html,body{background:#fff;color:#000;font-size:10.5pt}
  .noprint{display:none !important}
  .sheet{display:block}
  .wrap{max-width:none;padding:0}
  @page{size:A4 portrait;margin:11mm}
  .sheet table{font-size:8.6pt} .sheet th,.sheet td{padding:1.5px 4px;border-bottom:1px solid #999}
  .sheet h1{font-size:13pt;margin:0 0 2px} .sheet .note{font-size:7.6pt;color:#333}
}
</style>
</head>

  return '<circle cx="' + px(x).toFixed(0) + '" cy="' + py(y).toFixed(0) + '" r="' + r
    + '" fill="' + fill + '"' + (stroke ? ' stroke="' + stroke + '" stroke-width="60"' : "") + "/>";
}

var ROADPATH = (function () {
  var d = "";
  for (var i = 0; i < D.map.roads.length; i++) {
    var e = D.map.roads[i];
    d += "M" + px(e[0]).toFixed(0) + " " + py(e[1]).toFixed(0)
      + "L" + px(e[2]).toFixed(0) + " " + py(e[3]).toFixed(0) + " ";
  }
  return '<path d="' + d + '" fill="none" stroke="#33465c" stroke-width="70"/>';
}());

function drawMap() {
  var t = state.t, s = [];
  s.push('<g>');
  var i, c;
  /* Forecast first, observation on top: where a cell is both, what the satellite
     saw is the layer that decides the grading, so it is the layer that shows. */
  for (i = 0; i < D.map.forecast_cutoff_cells.length; i++) {
    c = D.map.forecast_cutoff_cells[i];
    if (c[2] <= t) { s.push(cellRect(c[0], c[1], "#f59e0b", 0.35)); }
  }
  for (i = 0; i < D.map.observed_cells.length; i++) {
    c = D.map.observed_cells[i];
    if (c[2] <= t) { s.push(cellRect(c[0], c[1], "#b91c1c", 0.9)); }
  }
  s.push(ROADPATH);
  for (i = 0; i < D.pickups.length; i++) {
    var p = D.pickups[i];
    s.push(dot(p.x, p.y, 90, "#475569"));
  }
  var v = vehicle();
  for (i = 0; i < v.trips.length; i++) {
    var tr = v.trips[i];
    if (tr.ingress.departure_min > t) { continue; }
    s.push(poly(tr.egress.xy, "#35d07f", 130, "600 400"));
    s.push(poly(tr.ingress.xy, tr.aborted_by_rule ? "#f87171" : "#22d3ee", 160));
    s.push(dot(tr.x, tr.y, 200, tr.aborted_by_rule ? "#f87171" : "#22d3ee", "#0b0f14"));
  }
  for (i = 0; i < D.refuges.length; i++) {
    var rf = D.refuges[i];
    s.push('<rect x="' + (px(rf.x) - 150).toFixed(0) + '" y="' + (py(rf.y) - 150).toFixed(0)
      + '" width="300" height="300" fill="' + (rf.rescue_reachable ? "#7ee2b8" : "#64748b") + '"/>');
  }
  for (i = 0; i < D.depots.length; i++) {
    var dp = D.depots[i];
    s.push('<polygon points="' + [
      px(dp.x) + "," + (py(dp.y) - 260), (px(dp.x) + 230) + "," + (py(dp.y) + 160),
      (px(dp.x) - 230) + "," + (py(dp.y) + 160)].join(" ")
      + '" fill="#fde047"/>');
  }
  s.push("</g>");
  var m = $("map");
  m.setAttribute("viewBox", "0 0 " + MW + " " + MH);
  m.innerHTML = s.join("");
}

function activeTrip() {
  var v = vehicle(), t = state.t, i;
  for (i = 0; i < v.trips.length; i++) {
    if (t < v.trips[i].free_at_min) { return v.trips[i]; }
  }
  return v.trips.length ? v.trips[v.trips.length - 1] : null;
}
function phaseOf(tr) {
  var t = state.t;
  if (tr.aborted_by_rule && t >= tr.abort_min) { return "중단 규칙 발동"; }
  if (t < tr.ingress.departure_min) { return "출발 대기"; }
  if (t < tr.eta_min) { return "진입 중"; }
  if (t < tr.eta_min + tr.load_min) { return "현장 승차"; }
  if (t < tr.delivered_min) { return "대피소로 이동"; }
  if (t < tr.free_at_min) { return "인계 중"; }
  return "완료";
}
function clsTag(c) {
  var k = c === "admissible_all" ? "ok" : (c === "inadmissible_all" ? "bad" : "warn");
  var ko = c === "admissible_all" ? "관측상 허용" :
    (c === "inadmissible_all" ? "관측상 불가" :
      (c === "indeterminate" ? "판정 불가" : esc(c)));
  return '<span class="tag ' + k + '">' + ko + "</span>";
}

/* ---------- downloads (written to outputs/ as well) ---------- */
function featureCollection() {
  var v = vehicle(), feats = [];
  for (var i = 0; i < v.trips.length; i++) {
    var t = v.trips[i];
    feats.push({ type: "Feature", properties: { leg: "ingress", seq: t.seq, vehicle: v.vehicle,
      drive_node: t.drive_node, eta_min: t.eta_min, abort_min: t.abort_min },
      geometry: { type: "LineString", coordinates: t.ingress.xy } });
    feats.push({ type: "Feature", properties: { leg: "egress", seq: t.seq, vehicle: v.vehicle,
      drive_node: t.drive_node, delivered_min: t.delivered_min },
      geometry: { type: "LineString", coordinates: t.egress.xy } });
  }
  return { type: "FeatureCollection", name: state.key + "_vehicle" + v.vehicle,
    crs_note: "EPSG:5179 metres (the routing CRS); the files under outputs/ carry WGS84",
    note: D.label_ko, features: feats };
}
/* The KML namespace is an IDENTIFIER and is never fetched. It is assembled from
   two literals because check_screen_assets.py scans raw lines for absolute URLs
   and exempts only the SVG and XLink namespaces; an unsplit literal here would
   read as an external reference in a page that has none. */
var KML_NS = "http" + "://www.opengis.net/kml/2.2";
function toKml() {
  var fc = featureCollection(), p = ['<?xml version="1.0" encoding="UTF-8"?>',
    '<kml xmlns="' + KML_NS + '"><Document>',
    "<name>" + esc(fc.name) + "</name>", "<description>" + esc(D.label_ko) + "</description>"];
  for (var i = 0; i < fc.features.length; i++) {
    var f = fc.features[i], c = [];
    for (var j = 0; j < f.geometry.coordinates.length; j++) {
      c.push(f.geometry.coordinates[j][0] + "," + f.geometry.coordinates[j][1] + ",0");
    }
    p.push("<Placemark><name>" + esc(f.properties.leg + " #" + f.properties.seq)
      + "</name><LineString><coordinates>" + c.join(" ")
      + "</coordinates></LineString></Placemark>");
  }
  p.push("</Document></kml>");
  return p.join("\n");
}
function save(name, text, mime) {
  var blob = new Blob([text], { type: mime });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
}

};

/* One documented hook, so a crew can bookmark its own vehicle and so the print
   test can measure the busiest sheet rather than whichever one loads first. It
   does exactly what the two dropdowns do and nothing else. */
window.WFG_SELECT = function (key, veh) {
  if (!D.runs[key]) { return false; }
  state.key = key;
  state.veh = Math.max(0, Math.min(veh | 0, D.runs[key].per_vehicle.length - 1));
  buildSelectors();
  redraw();
  return true;
};

buildBanner(); buildTicks(); buildSelectors(); redraw();

(function () {
  var m = /^#(k[0-9]+)\.v([0-9]+)$/.exec(window.location.hash || "");
  if (m) { window.WFG_SELECT(m[1], parseInt(m[2], 10)); }
}());
</script>
</body>
