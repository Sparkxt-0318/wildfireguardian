<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WildfireGuardian · 본선 시연</title>
<style>
/* Vendored fonts, relative paths only (web/assets/fonts). No remote anything. */
@font-face{font-family:'IBM Plex Sans KR';font-weight:400;font-display:block;
  src:url('assets/fonts/IBMPlexSansKR-Regular.woff2') format('woff2')}
@font-face{font-family:'IBM Plex Sans KR';font-weight:600;font-display:block;
  src:url('assets/fonts/IBMPlexSansKR-SemiBold.woff2') format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-weight:400;font-display:block;
  src:url('assets/fonts/IBMPlexMono-Regular.woff2') format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-weight:600;font-display:block;
  src:url('assets/fonts/IBMPlexMono-SemiBold.woff2') format('woff2')}
/* IBM Plex lacks U+2192/91/93; the arrow subset carries exactly those three. */
@font-face{font-family:'Arrow';font-weight:400;font-display:block;
  unicode-range:U+2192,U+2191,U+2193;
  src:url('assets/fonts/Pretendard-arrow.subset.woff2') format('woff2')}

:root{
  --bg:#0a0e13; --bg2:#0d1319; --panel:#101722; --panel2:#141d2a;
  --hair:#1c2734; --hair2:#27364a;
  --ink:#e9eef4; --ink2:#94a5b8; --ink3:#6e8095;
  --safe:#22d3ee; --route:#5ea0f2; --warn:#f59e0b; --closed:#dc2626;
  --warntext:#fde047; --focus:#fbbf24;
  --sans:'Arrow','IBM Plex Sans KR',system-ui,sans-serif;
  --mono:'Arrow','IBM Plex Mono',ui-monospace,monospace;
  --ease:cubic-bezier(.33,.02,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:var(--sans);color:var(--ink2);background:transparent;
  border:1px solid transparent;border-radius:3px;cursor:pointer;font-size:12px}
button:hover{color:var(--ink)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.k{font-size:10.5px;letter-spacing:.13em;color:var(--ink3);font-weight:600}
.hairline{border:0;border-top:1px solid var(--hair)}
[hidden]{display:none!important}

/* ---------- app frame ---------------------------------------------------- */
#app{position:fixed;inset:0;display:flex;flex-direction:column;
  opacity:0;transition:opacity .5s var(--ease)}
#app.on{opacity:1}
header{flex:0 0 52px;display:flex;align-items:center;gap:18px;
  padding:0 16px;border-bottom:1px solid var(--hair);background:var(--bg2)}
#brand{display:flex;flex-direction:column;line-height:1.25;min-width:196px}
#brand b{font-size:13.5px;font-weight:600;letter-spacing:.22em}
#brand span{font-size:10.5px;color:var(--ink3);letter-spacing:.02em}
#tabs{display:flex;gap:2px;margin:0 auto;border:1px solid var(--hair);
  border-radius:4px;padding:2px;background:var(--bg)}
#tabs button{padding:5px 14px;font-weight:600;font-size:12px;border-radius:3px}
#tabs button[aria-selected="true"]{background:var(--panel2);color:var(--ink);
  border-color:var(--hair2)}
#topright{display:flex;align-items:center;gap:6px;min-width:196px;
  justify-content:flex-end}
#topright button{padding:5px 9px;border:1px solid var(--hair)}
#topright button[aria-pressed="true"]{color:var(--ink);border-color:var(--hair2);
  background:var(--panel2)}
#btnGuide{background:#14303f;border-color:#1d4f66!important;color:#9fe3f2;
  font-weight:600}
#btnGuide:hover{background:#1a3c50;color:#c8eef8}
#panel.spot{box-shadow:inset 3px 0 0 var(--safe)}
.stamp{font-family:var(--mono);font-size:10.5px;fill:#ffb4a1;
  paint-order:stroke;stroke:#0a0e13;stroke-width:3px}

main{flex:1 1 auto;position:relative;min-height:0}
.view{position:absolute;inset:0;opacity:0;pointer-events:none;
  transition:opacity .28s var(--ease)}
.view.on{opacity:1;pointer-events:auto}

/* ---------- LIVE: map ----------------------------------------------------- */
#mapbox{position:absolute;left:0;right:340px;top:0;bottom:118px;cursor:default;
  background:#0f141b}
#map{display:block;width:100%;height:100%}
#map .roads path{fill:none;stroke:#3f5266;stroke-linecap:round;
  transition:stroke .5s var(--ease),opacity .5s var(--ease)}
#map path.hw0{stroke-width:.6;opacity:.55}
#map path.hw1{stroke-width:1.05;opacity:.8}
#map path.hw2{stroke-width:1.7;opacity:.95}
#map path.st1{stroke:var(--warn);stroke-dasharray:6 3.2}
#map path.st2{stroke:#e25b3d;stroke-dasharray:1.6 2.6;opacity:.95}
#map path.flash{stroke:#ff8a68;stroke-width:2.4}
@keyframes trigPulse{0%{r:6;opacity:.85}100%{r:26;opacity:0}}
.trigring{animation:trigPulse 2.2s var(--ease) infinite}
.inclabel{font-family:var(--mono);font-size:11px;letter-spacing:.22em;
  fill:#fde047}
#map .dimmed .roads path.st0{opacity:.18}
#map .quiet path.st1,#map .quiet path.st2{}
.origin{stroke:#0a0e13;stroke-width:.6;cursor:pointer}
.origin:hover{stroke:#fff;stroke-width:1}
.origin.sel{stroke:#fff;stroke-width:1.4}
#map text{font-family:var(--mono);fill:var(--ink2)}
.rt-naive{fill:none;stroke:#f87171;stroke-width:2.4;stroke-dasharray:7 5;
  stroke-linecap:round}
.rt-fa{fill:none;stroke:var(--safe);stroke-width:2.6;stroke-linecap:round}
.rt-danger{fill:none;stroke:#ff5a3c;stroke-width:4;stroke-linecap:round}
.refuge{fill:none;stroke:#9fb2c8;stroke-width:1}
.hoverbox rect{fill:rgba(10,14,19,.94);stroke:var(--hair2)}
.hoverbox text{font-size:11px;fill:var(--ink)}
.hoverbox .sub{fill:var(--ink2);font-size:10px}

#modeline{position:absolute;top:10px;left:50%;transform:translateX(-50%);
  max-width:min(680px,72%);padding:4px 12px;border:1px solid var(--hair);
  border-radius:3px;background:rgba(10,14,19,.88);color:var(--ink3);
  font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* region switcher */
#regions{position:absolute;left:14px;top:12px;display:flex;
  flex-direction:column;gap:6px;width:196px}
#regions button{display:flex;flex-direction:column;align-items:flex-start;
  gap:2px;padding:8px 11px;border:1px solid var(--hair);border-radius:4px;
  background:rgba(13,19,25,.9);text-align:left;width:100%}
#regions button b{font-size:13px;color:var(--ink);font-weight:600}
#regions button span{font-size:10.5px;color:var(--ink3)}
#regions button[aria-pressed="true"]{border-color:var(--hair2);
  background:rgba(20,29,42,.95);box-shadow:inset 2px 0 0 var(--safe)}
#regions .k{margin-left:2px;margin-bottom:-2px}

/* legend */
#legend{position:absolute;left:14px;bottom:130px;padding:9px 12px;
  border:1px solid var(--hair);border-radius:4px;background:rgba(10,14,19,.9);
  font-size:11px;color:var(--ink2);display:flex;flex-direction:column;gap:3px}
#legend .row{display:flex;align-items:center;gap:7px}
#legend svg{flex:0 0 22px}
#legend .gap{height:4px}

/* right panel */
#panel{position:absolute;right:0;top:0;bottom:118px;width:340px;
  border-left:1px solid var(--hair);background:rgba(13,18,25,.94);
  display:flex;flex-direction:column;min-height:0}
#panel .head{flex:0 0 auto;padding:12px 16px 9px;border-bottom:1px solid var(--hair)}
#panel .head b{font-size:13px}
#panel .body{flex:1 1 auto;overflow-y:auto;padding:12px 16px;min-height:0}
#panel .foot{flex:0 0 auto;padding:9px 16px;border-top:1px solid var(--hair);
  color:var(--ink3);font-size:10.5px;line-height:1.55}
.stat{display:flex;align-items:baseline;gap:8px;margin:2px 0}
.stat .v{font-family:var(--mono);font-weight:600;font-size:21px}
.stat .u{color:var(--ink3);font-size:11px}
.bucketrow{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:12.5px}
.bucketrow .m{width:14px;text-align:center}
.bucketrow .n{margin-left:auto;font-family:var(--mono);font-weight:600}
.card{border:1px solid var(--hair);border-radius:4px;padding:11px 12px;
  margin:9px 0;background:rgba(16,23,34,.6)}
.card h4{font-size:12px;margin-bottom:6px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;
  border-radius:3px;font-size:12px;font-weight:600}
.cmp{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px}
.cmp td,.cmp th{padding:3px 4px;border-bottom:1px solid var(--hair);text-align:right}
.cmp td:first-child,.cmp th:first-child{text-align:left;color:var(--ink2)}
.cmp .num{font-weight:600}
.note{color:var(--ink3);font-size:11px;line-height:1.55;margin-top:6px}
.note.warn{color:var(--warntext)}

/* timeline */
#timeline{position:absolute;left:0;right:0;bottom:0;height:118px;
  border-top:1px solid var(--hair);background:rgba(10,14,19,.97);
  display:flex;align-items:stretch;gap:0}
#transport{flex:0 0 196px;display:flex;flex-direction:column;
  justify-content:center;gap:6px;padding:0 14px;border-right:1px solid var(--hair)}
#transport .row{display:flex;gap:6px}
#transport button{width:34px;height:30px;border:1px solid var(--hair);
  display:flex;align-items:center;justify-content:center}
#transport button:hover{border-color:var(--hair2);background:var(--panel)}
#transport svg{display:block}
#tchip{font-family:var(--mono);font-weight:600;font-size:20px}
#tchip small{font-size:10px;color:var(--ink3);font-weight:400;display:block;
  letter-spacing:.08em}
#tlwrap{flex:1 1 auto;position:relative;min-width:0}
#tl{display:block;width:100%;height:100%;touch-action:none}
#tlstatus{position:absolute;right:14px;top:7px;font-size:11px;color:var(--ink3)}
#tlstatus b{color:var(--warntext);font-family:var(--mono)}

/* ---------- guided overlay ------------------------------------------------ */
#guide{position:absolute;left:0;right:340px;bottom:130px;display:flex;
  justify-content:center;pointer-events:none;z-index:30}
#guidecard{pointer-events:auto;max-width:620px;margin:0 12px;
  border:1px solid var(--hair2);border-radius:6px;background:rgba(10,14,19,.95);
  padding:14px 18px 12px;box-shadow:0 14px 40px rgba(0,0,0,.5)}
#guidecard .k{display:flex;gap:10px;align-items:center;margin-bottom:6px}
#gtitle{font-size:16px;font-weight:600;letter-spacing:.01em}
#gbody{font-size:13.5px;color:var(--ink2);line-height:1.65;margin-top:2px}
#gbody b{color:var(--ink);font-weight:600}
#gmeta{font-family:var(--mono);font-size:11.5px;color:var(--ink3);margin-top:7px}
#gnav{display:flex;align-items:center;gap:10px;margin-top:11px}
#gdots{display:flex;gap:5px;margin-right:auto}
#gdots i{width:18px;height:3px;border-radius:2px;background:var(--hair2)}
#gdots i.on{background:var(--safe)}
#gnav button{padding:6px 14px;border:1px solid var(--hair2);font-weight:600}
#gnav button.primary{background:#173042;border-color:#1d4f66;color:#aee9f6}
#gnav button.primary:hover{background:#1b3a50}

/* ---------- static views -------------------------------------------------- */
.page{position:absolute;inset:0;overflow-y:auto;padding:26px 34px 40px}
.page h2{font-size:17px;font-weight:600;margin-bottom:3px}
.page .sub{color:var(--ink3);font-size:12px;margin-bottom:20px}
.grid{display:grid;gap:12px}
.ev-grid{grid-template-columns:repeat(auto-fit,minmax(300px,1fr));max-width:1460px}
.evcard{border:1px solid var(--hair);border-radius:5px;background:var(--panel);
  padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-height:118px}
.evcard .k{display:flex;justify-content:space-between;align-items:center}
.evcard .big{font-family:var(--mono);font-weight:600;font-size:30px;line-height:1.1}
.evcard .big small{font-size:13px;color:var(--ink2);font-weight:400}
.evcard p{font-size:12px;color:var(--ink2);line-height:1.55}
.evcard .src{margin-top:auto}
.srcbtn{font-size:10.5px;color:var(--ink3);border:1px solid var(--hair);
  padding:2px 8px;border-radius:3px}
.srcbtn:hover{color:var(--ink);border-color:var(--hair2)}
.prov{font-family:var(--mono);font-size:10.5px;color:var(--ink3);
  border-top:1px solid var(--hair);margin-top:8px;padding-top:8px;
  line-height:1.6;word-break:break-all}
table.regions{border-collapse:collapse;width:100%;font-size:12.5px}
table.regions th{font-size:10.5px;letter-spacing:.1em;color:var(--ink3);
  text-align:right;padding:6px 8px;border-bottom:1px solid var(--hair2)}
table.regions td{padding:7px 8px;border-bottom:1px solid var(--hair);
  text-align:right;font-family:var(--mono)}
table.regions td:first-child,table.regions th:first-child{text-align:left;
  font-family:var(--sans)}

/* system view */
#sysflow{display:flex;gap:12px;align-items:stretch;max-width:1460px;
  margin-top:26px}
.stage{flex:1 1 0;border:1px solid var(--hair);border-radius:5px;
  background:var(--panel);padding:18px 16px 15px;cursor:pointer;
  transition:opacity .25s var(--ease),border-color .25s var(--ease);min-width:0}
.stage .n{font-family:var(--mono);font-size:10px;color:var(--ink3)}
.stage h3{font-size:14.5px;margin:10px 0 3px}
.stage .en{font-size:10px;letter-spacing:.14em;color:var(--ink3)}
.stage svg{margin-top:10px}
#sysflow.focus .stage{opacity:.32}
#sysflow.focus .stage.on{opacity:1}
.stage.on{border-color:var(--hair2);box-shadow:inset 0 2px 0 var(--safe)}
.arrowsep{align-self:center;color:var(--ink3);font-family:var(--mono);
  font-size:16px}
#sysdetail{max-width:1460px;margin-top:18px;border:1px solid var(--hair);
  border-radius:5px;background:var(--panel);padding:22px 24px;min-height:118px}
#sysdetail h3{font-size:16px;margin-bottom:8px}
#sysdetail p{font-size:14px;color:var(--ink2);line-height:1.7;max-width:920px}
#syssrc{max-width:1460px;margin-top:18px;display:flex;gap:26px;
  font-family:var(--mono);font-size:11px;color:var(--ink3);flex-wrap:wrap}
#syssrc span b{color:var(--ink2);font-weight:600}

/* reliability */
.rel-grid{grid-template-columns:repeat(auto-fit,minmax(340px,1fr));max-width:1460px}
.relcard{border:1px solid var(--hair);border-radius:5px;background:var(--panel);
  padding:14px 16px}
.relcard h3{font-size:13px;margin-bottom:6px}
.relcard p{font-size:12px;color:var(--ink2);line-height:1.6}
.relcard .doc{font-family:var(--mono);font-size:10.5px;color:var(--ink3);
  margin-top:8px}
blockquote{border-left:2px solid var(--hair2);padding:2px 0 2px 12px;
  color:var(--ink);font-size:12.5px;line-height:1.65;margin:8px 0}
#integrity{max-width:1460px;border:1px solid var(--hair);border-radius:5px;
  background:var(--panel);padding:14px 16px;margin-bottom:14px}
#integrity .k{display:flex;gap:14px;align-items:center;margin-bottom:8px}
.gate{display:flex;gap:10px;align-items:center;font-family:var(--mono);
  font-size:12px;padding:3px 0}
.gate .ok{color:#34d399;font-weight:600}
.gate .fail{color:#f87171;font-weight:600}
.gate .na{color:var(--ink3)}

/* ---------- intro ---------------------------------------------------------- */
#intro{position:fixed;inset:0;z-index:60;background:#05070a;display:flex;
  align-items:center;justify-content:center;overflow:hidden}
#introMedia,#introFallback{position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;opacity:.5}
#introFallback{background-size:cover;background-position:center;
  transform:scale(1.04)}
@keyframes introPan{from{transform:scale(1.04) translateY(0)}
  to{transform:scale(1.12) translateY(-1.6%)}}
#intro.live #introFallback{animation:introPan 14s var(--ease) forwards}
#introScrim{position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 62%,rgba(5,7,10,.25),rgba(5,7,10,.88) 78%)}
#introText{position:relative;text-align:center;max-width:760px;padding:0 30px}
#introText .line{opacity:0;transform:translateY(8px);
  transition:opacity .9s var(--ease),transform .9s var(--ease)}
#introText .line.on{opacity:1;transform:none}
#introTag{font-family:var(--mono);font-size:12px;letter-spacing:.34em;
  color:var(--ink3);margin-bottom:26px}
.introLead{font-size:23px;font-weight:400;color:var(--ink);margin:10px 0;
  line-height:1.55}
#introTitle{margin-top:34px}
#introTitle b{display:block;font-size:34px;font-weight:600;letter-spacing:.3em;
  padding-left:.3em}
#introTitle span{display:block;margin-top:10px;font-size:13px;color:var(--ink2)}
#introBtns{margin-top:36px;display:flex;gap:12px;justify-content:center}
#introBtns button{padding:10px 22px;font-size:13px;font-weight:600;
  border:1px solid var(--hair2)}
#introBtns .primary{background:#173042;border-color:#2a6d8c;color:#c8eef8}
#introBtns .primary:hover{background:#1c3d55}
#skipIntro{position:absolute;right:18px;bottom:16px;color:var(--ink3);
  font-size:11.5px;padding:6px 12px;border:1px solid var(--hair)}

/* presenter menu */
#presenter{position:absolute;right:352px;bottom:130px;z-index:40}
#presBtn{width:34px;height:34px;border:1px solid var(--hair);border-radius:4px;
  background:rgba(10,14,19,.9);display:flex;align-items:center;justify-content:center}
#presMenu{position:absolute;right:0;bottom:42px;width:238px;
  border:1px solid var(--hair2);border-radius:5px;background:rgba(10,14,19,.97);
  padding:8px;box-shadow:0 14px 40px rgba(0,0,0,.55)}
#presMenu button{display:flex;width:100%;text-align:left;padding:7px 9px;
  gap:8px;align-items:center;font-size:12px;justify-content:space-between}
#presMenu button:hover{background:var(--panel2);color:var(--ink)}
#presMenu .kbd{font-family:var(--mono);font-size:10px;color:var(--ink3);
  border:1px solid var(--hair);border-radius:3px;padding:1px 5px}
#presMenu hr{margin:6px 2px}

@media (prefers-reduced-motion: reduce){
  *{transition:none!important;animation:none!important}
}
</style>
</head>
<body>

<div id="intro" hidden>
  <video id="introMedia" muted playsinline loop hidden></video>
  <div id="introFallback" hidden></div>
  <div id="introScrim"></div>
  <div id="introText">
    <div class="line" id="iTag"><div id="introTag"></div></div>
    <div class="line"><p class="introLead" id="iL1"></p></div>
    <div class="line"><p class="introLead" id="iL2"></p></div>
    <div class="line"><p class="introLead" id="iL3"></p></div>
    <div class="line" id="iTitle">
      <div id="introTitle"><b>WILDFIRE GUARDIAN</b><span id="iSub"></span></div>
      <div id="introBtns">
        <button class="primary" id="introGo"></button>
        <button id="introExplore"></button>
      </div>
    </div>
  </div>
  <button id="skipIntro"></button>
</div>

<div id="app">
<header>
  <div id="brand"><b>WILDFIRE GUARDIAN</b><span id="brandSub"></span></div>
  <nav id="tabs" role="tablist" aria-label="화면"></nav>
  <div id="topright">
    <button id="btnGuide" title="G"></button>
    <button id="btnSound" aria-pressed="false"></button>
    <button id="btnLang" aria-pressed="false">EN</button>
  </div>
</header>
<main>

  <!-- LIVE -->
  <section class="view on" id="view-live">
    <div id="mapbox">
      <svg id="map" preserveAspectRatio="xMidYMid meet" role="img"
           aria-label="지역 위험면과 도로망, 대피 경로 지도" tabindex="0"></svg>
    </div>
    <div id="modeline"></div>
    <div id="regions" role="group"></div>
    <div id="legend"></div>
    <aside id="panel">
      <div class="head"><b id="panelTitle"></b></div>
      <div class="body" id="panelBody"></div>
      <div class="foot" id="panelFoot"></div>
    </aside>
    <div id="timeline">
      <div id="transport">
        <div id="tchip">t+00:00<small id="tchipsub"></small></div>
        <div class="row">
          <button id="btnPlay" title="Space"></button>
          <button id="btnReset" title="R"></button>
          <button id="btnNextClosure"></button>
        </div>
      </div>
      <div id="tlwrap"><svg id="tl"></svg><div id="tlstatus"></div></div>
    </div>
    <div id="guide" hidden>
      <div id="guidecard" role="dialog" aria-label="안내 시연">
        <div class="k"><span class="k" id="gact"></span></div>
        <div id="gtitle"></div>
        <div id="gbody"></div>
        <div id="gmeta"></div>
        <div id="gnav">
          <div id="gdots"></div>
          <button id="gPrev"></button>
          <button id="gNext" class="primary"></button>
          <button id="gExit"></button>
        </div>
      </div>
    </div>
    <div id="presenter">
      <button id="presBtn" aria-haspopup="true" aria-expanded="false"
              title="프리젠터 컨트롤">
        <svg width="15" height="15" viewBox="0 0 15 15" aria-hidden="true">
          <circle cx="3" cy="7.5" r="1.4" fill="#94a5b8"/>

/* ---------- tiny DOM/SVG helpers ------------------------------------------ */
function el(tag, attrs, parent) {

}
function hel(tag, cls, parent, text) {

}
function markPath(shape, x, y, s) {
  if (shape === 'circle') return `M${x - s},${y}a${s},${s} 0 1,0 ${2 * s},0a${s},${s} 0 1,0 ${-2 * s},0`;
  if (shape === 'triangle') return `M${x},${y - s}L${x + s},${y + s}L${x - s},${y + s}Z`;
  if (shape === 'square') return `M${x - s},${y - s}h${2 * s}v${2 * s}h${-2 * s}Z`;
  return `M${x},${y - s}L${x + s},${y}L${x},${y + s}L${x - s},${y}Z`;

/* ---------- projection + map mount ----------------------------------------- */
const map = $('map');

function mountRegion(id, keepT) {
  state.region = id;

      width: r.hill.w, height: r.hill.h,
      preserveAspectRatio: 'none' }, L.hill);

    el('rect', { x: -600, y: -300, width: 2200, height: r.view.vh + 600,
      fill: '#0f141b' }, L.hill);

  // hazard: one group per slice, 4 band paths each; crossfade on t
  L.haz = el('g', { opacity: 0.8 }, map);

  for (let s = 0; s < hz.bands.length; s++) {
    const g = el('g', { opacity: s === 0 ? 1 : 0 }, L.haz);
    for (let b = 0; b < 4; b++) {
      let d = '';
      for (const run of hz.bands[s][b]) {
        const x = hz.ox + run[1] * hz.cell, y = hz.oy + run[0] * hz.cell;
        d += `M${x.toFixed(1)},${y.toFixed(1)}h${(run[2] * hz.cell).toFixed(1)}v${hz.cell}h${(-run[2] * hz.cell).toFixed(1)}Z`;
      }
      el('path', { d, fill: DATA.band_fills[b],
        'fill-opacity': (b === 0 ? 0.1 : 0.1 + 0.15 * b) }, g);
    }
    L.hazSlices.push(g);
  }
  // evaluated area: the walk bbox, dashed (what "coverage" is measured against)
  L.bbox = el('g', {}, map);
  if (r.bbox) {
    const d = 'M' + r.bbox.map((p) => p[0] + ',' + p[1]).join('L') + 'Z';
    el('path', { d, fill: 'none', stroke: '#7c8ba1', 'stroke-width': 1,
      'stroke-dasharray': '7 6', opacity: 0.5 }, L.bbox);
  }
  // roads
  L.roads = el('g', { class: 'roads' }, map);
  edgeEls = []; edgeState = new Int8Array(r.roads.lens.length).fill(-1);
  {
    const pts = r.roads.pts, lens = r.roads.lens;
    let p = 0;
    for (let i = 0; i < lens.length; i++) {
      let d = `M${pts[p]},${pts[p + 1]}`;
      for (let j = 1; j < lens[i]; j++) d += `L${pts[p + 2 * j]},${pts[p + 2 * j + 1]}`;
      p += 2 * lens[i];

      path.style.pointerEvents = 'none';

  for (const bi of zorder) {
    r.origins.forEach((o, i) => {
      if (o[2] !== bi) return;
      const b = DATA.buckets[bi];
      const urgent = bi === 1 || bi === 2;
      const path = el('path', {
        d: markPath(b.shape, o[0], o[1], urgent ? 4.6 : 3.3),

/* ---------- roads over time ------------------------------------------------ */
function edgeStateAt(r, i, t) {
  const tc = r.roads.tc[i], tr = r.roads.tr[i];
  if (tc >= 0 && t >= tc) return 2;
  if (tr >= 0 && t >= tr) return 1;
  return 0;
}
function applyTime(force) {
  const r = R();
  const t = state.t;
  // hazard slice crossfade
  const times = r.haz.times;
  let s = 0;
  while (s < times.length - 1 && t > times[s + 1]) s++;
  const f = (s >= times.length - 1) ? 0
    : Math.max(0, Math.min(1, (t - times[s]) / (times[s + 1] - times[s])));
  L.hazSlices.forEach((g, i) => {
    const o = (i === s) ? 1 - f : (i === s + 1 ? f : 0);
    g.setAttribute('opacity', o.toFixed(3));
  });
  // road states (update only changes)
  let newlyClosed = 0;
  for (let i = 0; i < edgeEls.length; i++) {
    const st = edgeStateAt(r, i, t);
    if (st !== edgeState[i] || force) {
      if (st === 2 && edgeState[i] !== 2 && edgeState[i] !== -1 && !REDUCED) {
        const elp = edgeEls[i];
        elp.classList.add('flash'); newlyClosed++;
        setTimeout(() => elp.classList.remove('flash'), 850);
      }
      edgeEls[i].classList.remove('st0', 'st1', 'st2');
      edgeEls[i].classList.add('st' + st);
      edgeState[i] = st;
    }
  }
  if (newlyClosed > 0) AUDIO.cue('closure');
  // route danger reveal in compare mode
  updateRouteDanger();
  // chips + timeline + status
  $('tchip').firstChild.textContent = fmtT(t);
  updateTlStatus();
  moveTlPlayhead();
}
function lossAt(t) {
  const r = R(), i = Math.min(r.loss.t.length - 1, Math.floor(t / 10));
  return { n: r.loss.n[i], km: r.loss.km[i] };
}
function updateTlStatus() {
  const { n, km } = lossAt(state.t);
  const elx = $('tlstatus');
  elx.innerHTML = '';
  const s = hel('span', null, elx);
  s.append(T('tlClosed') + ' ');
  hel('b', null, s, String(n));
  s.append(' · ' + km.toFixed(0) + ' km');
}

/* ---------- time engine ----------------------------------------------------- */
// rAF for smoothness, plus an interval watchdog so playback still advances
// when the browser throttles animation frames (background tab, embedded pane)
let rafId = null, lastTs = null, watchdog = null;
const PLAY_RATE = 720 / 26;   // minutes per second: full horizon in ~26 s
function stepClock(now) {
  if (!state.playing) return;
  if (lastTs === null) lastTs = now;
  const dt = (now - lastTs) / 1000; lastTs = now;
  state.t = Math.min(720, state.t + dt * PLAY_RATE);
  applyTime();
  if (state.t >= 720) setPlaying(false);
}
function tick(ts) {
  if (!state.playing) return;
  stepClock(ts);
  if (state.playing) rafId = requestAnimationFrame(tick);
}
function setPlaying(on) {
  if (on === state.playing) return;
  state.playing = on; lastTs = null;
  renderTransport();
  if (on) {
    rafId = requestAnimationFrame(tick);
    watchdog = setInterval(() => {
      const now = performance.now();
      if (state.playing && now - (lastTs ?? 0) > 260) stepClock(now);
    }, 200);
  } else {
    if (rafId) cancelAnimationFrame(rafId);
    if (watchdog) { clearInterval(watchdog); watchdog = null; }
  }
}
function setT(t, silent) {
  state.t = Math.max(0, Math.min(720, t));
  applyTime();
  if (!silent) setPlaying(false);
}

/* ---------- hit grid + hover ----------------------------------------------- */
let hitGrid = null;
function buildHitGrid(r) {
  const cell = 22; // viewBox units
  const grid = new Map();
  const pts = r.roads.pts, lens = r.roads.lens;
  let p = 0;
  for (let i = 0; i < lens.length; i++) {
    for (let j = 0; j < lens[i] - 1; j++) {
      const x = (pts[p + 2 * j] + pts[p + 2 * j + 2]) / 2;
      const y = (pts[p + 2 * j + 1] + pts[p + 2 * j + 3]) / 2;
      const key = (x / cell | 0) + ',' + (y / cell | 0);
      if (!grid.has(key)) grid.set(key, []);
      grid.get(key).push([x, y, i]);
    }
    p += 2 * lens[i];
  }
  hitGrid = { grid, cell };
}
function nearestEdge(x, y, maxD) {
  const { grid, cell } = hitGrid;
  let best = null, bd = maxD * maxD;
  const cx = x / cell | 0, cy = y / cell | 0;
  for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) {
    const arr = grid.get((cx + dx) + ',' + (cy + dy));
    if (!arr) continue;
    for (const [px, py, i] of arr) {
      const d = (px - x) * (px - x) + (py - y) * (py - y);
      if (d < bd) { bd = d; best = i; }
    }
  }
  return best;
}
function svgPoint(ev) {

  pt.x = ev.clientX; pt.y = ev.clientY;
  const m = map.getScreenCTM();
  if (!m) return null;
  const p = pt.matrixTransform(m.inverse());

}

function polyD(flat) {

  const naive = el('path', { d: polyD(rt.naive.pts), class: 'rt-naive' }, L.routes);
  animateDraw(naive);
  if (showFa) {
    const fa = el('path', { d: polyD(rt.fa.pts), class: 'rt-fa' }, L.routes);
    animateDraw(fa, 250);
  }

}

    ? '7 5' : 'none';

function updateRouteDanger() {

  const old = L.routes && L.routes.querySelector('.rt-danger');
  if (old) old.remove();

  const r = R();
  const rt = r.routes[state.selRoute];
  const tcs = rt.naive.tc, pts = rt.naive.pts;
  let d = '', open = false;
  for (let i = 0; i < tcs.length; i++) {
    const hot = tcs[i] >= 0 && tcs[i] <= state.t;
    if (hot && !open) { d += `M${pts[2 * i]},${pts[2 * i + 1]}`; open = true; }
    else if (hot) d += `L${pts[2 * i]},${pts[2 * i + 1]}`;
    else open = false;

    // a small honest stamp at the first point past the threshold
    let first = -1, minTc = Infinity;
    for (let i = 0; i < tcs.length; i++)
      if (tcs[i] >= 0 && tcs[i] <= state.t && tcs[i] < minTc) { minTc = tcs[i]; first = i; }

}

const tl = $('tl');
let tlW = 600, tlH = 118, tlPad = 26;
function tlX(t) { return tlPad + (t / 720) * (tlW - 2 * tlPad); }

function renderTimeline() {

  tlW = Math.max(320, rect.width); tlH = rect.height;
  tl.setAttribute('viewBox', `0 0 ${tlW} ${tlH}`);
  tl.innerHTML = '';

  const maxN = Math.max(1, r.loss.n[r.loss.n.length - 1]);
  let d = `M${tlX(0)},${baseY}`;
  for (let i = 0; i < r.loss.t.length; i++) {
    const y = baseY - (r.loss.n[i] / maxN) * (tlH - 62);
    d += `L${tlX(r.loss.t[i])},${y}`;
  }
  d += `L${tlX(720)},${baseY}Z`;
  el('path', { d, fill: '#e04b32', opacity: 0.07 }, tl);
  el('path', { d: d.replace(/Z$/, ''), fill: 'none', stroke: '#e04b32',
    opacity: 0.28, 'stroke-width': 1 }, tl);
  // base track
  el('line', { x1: tlX(0), y1: baseY, x2: tlX(720), y2: baseY,
    stroke: '#27364a', 'stroke-width': 2 }, tl);
  // slice ticks
  for (const t of r.haz.times) {
    el('line', { x1: tlX(t), y1: baseY - 5, x2: tlX(t), y2: baseY + 5,
      stroke: '#3a4c63', 'stroke-width': 1.4 }, tl);
    const lbl = el('text', { x: tlX(t), y: baseY + 20, 'text-anchor': 'middle',
      'font-size': 10.5, fill: '#6e8095',
      'font-family': 'var(--mono)' }, tl);
    lbl.textContent = 't+' + (t / 60) + 'h';
  }
  // closure event ticks (60-min bins, quiet)
  const bins = new Map();
  for (const tc of r.roads.tc) {
    if (tc <= 0) continue;
    const b = Math.max(1, Math.ceil(tc / 60)) * 60;
    bins.set(b, (bins.get(b) || 0) + 1);
  }
  for (const [t, n] of bins) {
    const h = Math.min(12, 3 + Math.log2(1 + n) * 2.4);
    el('line', { x1: tlX(t), y1: baseY - h, x2: tlX(t), y2: baseY - 1,
      stroke: '#f59e0b', 'stroke-width': 2, opacity: 0.55 }, tl);
  }
  // route event marker for selection
  if (state.selRoute !== null) {
    const rt = r.routes[state.selRoute];
    const ntc = rt.naive.tc.filter((t) => t >= 0);
    if (ntc.length) {
      const t = Math.min(...ntc);
      el('path', { d: markPath('diamond', tlX(t), baseY - 20, 4),
        fill: '#f87171' }, tl);
    }
  }

  const ph = el('g', { id: 'playhead' }, tl);
  el('line', { x1: 0, y1: 14, x2: 0, y2: baseY + 6, stroke: '#e9eef4',
    'stroke-width': 1.2, opacity: 0.9 }, ph);
  el('circle', { cx: 0, cy: baseY, r: 5, fill: '#e9eef4' }, ph);

    'font-size': 10.5, fill: '#94a5b8', 'font-family': 'var(--mono)',

  moveTlPlayhead();
  renderTransport();

      '커버리지·대피소 밀도 같은 공변량이 지역마다 다르므로 이 표는 순위가 아닙니다. 커버리지가 낮은 행의 절대 수치는 그 커버리지 안에서의 값입니다.');
    provBlock(c, ['data/processed/multi_region_comparison.json :: regions[*]',
      'data/processed/real_roads_real_hazard_*.json :: arms.slope_digraph_canonical.counts']);
    const btn = hel('button', 'srcbtn', k, T('src'));
    const prov = c.querySelector('.prov');
    btn.addEventListener('click', () => {
      prov.hidden = !prov.hidden;
      btn.textContent = prov.hidden ? T('src') : T('srcClose');
    });
  }

  // responder exposure
  {
    const e = regEntry('responder_exposure_reduction_pct');
    const sp = regEntry('responder_exposure_shortest_path_mean');
    const sa = regEntry('responder_exposure_survival_aware_mean');
    const nD = regEntry('rescue_dispatch_count');
    if (e && sp && sa) {
      const c = evCard(g, '구조자 측 · 위험 노출 대비',
        sp.value.toFixed(2) + ' → ' + sa.value.toFixed(2), 'prob·min (평균)',
        (nD ? nD.value : '') + '개 동일 출발지에 대한 짝지은 대비로, 생존 인지 경로가 최단 경로 대비 노출을 ' +
        e.value.toFixed(1) + '% 줄입니다. 정책 간 상대 비교이며 절대 안전 보장이 아닙니다.',
        regProv('responder_exposure_reduction_pct'));
      const warnEl = hel('p', 'note warn', c,
        '합성 위험면 기반 · 짝지은 대비만 유효 · 도로망과 시설 위치는 실측 OSM');
      c.insertBefore(warnEl, c.querySelector('.prov'));
    }
  }

  // terrain
  {
    const e = regEntry('slope_walk_time_increase_pct');
    const routesChanged = regEntry('slope_canonical_fa_routes_changed_60m');
    const saving = regEntry('objective_canonical_longest_walk_saving_min');
    if (e) {
      evCard(g, '지형 보정 · 경사가 걸음을 바꿉니다',
        '+' + e.value.toFixed(1) + '%', '보행 시간 (60 m 표집)',
        '경사를 반영하면 전체 보행 시간이 늘고' +
        (routesChanged ? ', 시간 인지 경로 ' + routesChanged.value + '건의 형태가 바뀝니다' : '') +
        (saving ? '. 최악 사례 1건에서 최장 도보가 ' + saving.value.toFixed(0) + '분 줄었습니다' : '') +
        '. 표집 간격에 민감한 값이라 간격을 항상 함께 적습니다.',
        regProv('slope_walk_time_increase_pct'));
    }
  }

  // runtime
  {
    const parts = [];
    for (const id of DATA.region_order) {
      const r = DATA.regions[id];
      if (r.prov.warm_s != null)
        parts.push(r.label + ' ' + r.prov.warm_s.toFixed(1) + 's');
    }
    evCard(g, '실행 시간 · 트리거에서 출동 목록까지',
      parts.length ? parts[0].split(' ').pop() : '', '(재생 런 실측)',
      '사전 적재된 상태에서 좌표 입력부터 전 지역 출동 목록·전달문 생성까지의 실측값: ' +
      parts.join(' · ') + '. 지역 간 순위가 아닙니다.',
      DATA.region_order.map((id) =>
        'outputs/live/replay run ' + DATA.regions[id].prov.run + ' :: timings_s'));
  }

  // registry
  evCard(g, '검증 레지스트리',
    DATA.registry.n_entries + '', '항목 · 재현 가능 ' + DATA.registry.n_reproducible,
    '화면과 문서의 주요 수치는 레지스트리에 등록되어 산출물과 자동 대조됩니다. 「재현 불가」는 「틀림」이 아니라, 출처는 검증되었으나 입력 자료가 더 이상 재생성될 수 없음을 뜻합니다.',
    ['docs/NUMBERS.json :: numbers (config ' + DATA.registry.config_hash + ')',
     'built at commit ' + DATA.registry.built_at_commit]);
}

/* ---------- RELIABILITY view -------------------------------------------------------- */
let relBuilt = false;
function renderReliability() {
  $('relH').textContent = T('rel_h');
  $('relSub').textContent = T('rel_sub');
  if (relBuilt) return;
  relBuilt = true;

  // integrity strip
  const box = $('integrity');
  box.innerHTML = '';
  const k = hel('div', 'k', box);
  hel('span', 'k', k, 'SYSTEM INTEGRITY');
  hel('span', null, k, 'build ' + DATA.built_utc + ' · commit ' + DATA.git).style.cssText =
    'font-family:var(--mono);font-size:11px;color:var(--ink3)';
  const IG = DATA.integrity;
  if (IG.verified && IG.gates.length) {
    for (const gate of IG.gates) {
      const row = hel('div', 'gate', box);
      hel('span', gate.ok ? 'ok' : 'fail', row, gate.ok ? 'PASS' : 'FAIL');
      hel('span', null, row, gate.name);
      hel('span', null, row, gate.line).style.color = 'var(--ink3)';
      hel('span', null, row, gate.seconds + 's').style.color = 'var(--ink3)';
    }
  } else {
    const row = hel('div', 'gate', box);
    hel('span', 'na', row, 'NOT RUN');
    hel('span', null, row,
      '이 빌드는 게이트를 실행하지 않았습니다. make finals 는 --verify 로 실행 결과를 기록합니다.');
  }
  for (const id of DATA.region_order) {
    const r = DATA.regions[id];
    const row = hel('div', 'gate', box);
    hel('span', 'na', row, 'DATA');
    hel('span', null, row, r.label);
    hel('span', null, row, r.prov.npz + ' (sha ' + r.prov.npz_sha16 + ') · run ' +
      r.prov.run).style.color = 'var(--ink3)';
  }

  const g = $('relgrid');
  function rel(title, body, doc, quote) {
    const c = hel('div', 'relcard', g);
    hel('h3', null, c, title);
    if (quote) hel('blockquote', null, c, quote);
    hel('p', null, c, body);
    if (doc) hel('div', 'doc', c, doc);
    return c;
  }

  const yd = DATA.regions[DATA.region_order[0]];
  rel('보행망 커버리지',
    '커버리지가 가장 낮은 지역의 절대 수치는 덮인 범위 안에서의 값이며, 나머지 범위의 거동은 측정되지 않았고 편향의 방향도 알 수 없습니다. 짝지은 대비는 두 경로가 같은 출발지를 쓰므로 이 한계의 영향을 받지 않습니다.',
    'docs/walk_bbox_coverage.md · multi_region_comparison.json',
    yd.coverage_note || null);

  rel('입력 민감도',
    '보행망 노드의 0.05% 미만 변화가 이진 판정(도달 가능 여부) 건수를 크게 움직인 사례가 기록되어 있습니다. 같은 실험에서 짝지은 노출 대비는 1%p 미만으로 움직였습니다. 그래서 이 화면의 강조는 대비에 있습니다.',
    'docs/network_drift.md');

  rel('운영용 소프트웨어가 아닙니다',
    '실무자 평가를 거치지 않았고, 전문가 검토 없이 공식 대피 명령의 유일한 근거로 사용해서는 안 됩니다. 보행 속도·차량 속도·운용 창 등 핵심 파라미터는 가정값이며 저장소에 실측 근거가 없습니다.',
    'README 현재 상태 · config/default.yaml (# ASSUMED)');

  rel('대피 지점 레이어의 실체',
    '대피 지점의 다수는 OSM의 공원·정자류 태그입니다. 하류 필터링은 하지 않습니다. 지역 간 「대피소 밀도」 차이는 상당 부분 지도 제작 관행의 차이입니다.',
    'docs/multi_region.md §3.2');

  rel('화재 경계 검증의 한계',
    '전방 시뮬레이션 외피의 면적 편향은 지역에 따라 과대·과소로 부호가 바뀌므로 하나의 보정으로 제거할 수 없습니다. 정직한 발자국 지표(IoU 약 0.40)를 함께 표기하는 이유입니다. 위험면의 시간 해상도는 3시간, 공간 해상도는 500 m 입니다.',
    'docs/HANDOFF_ROUND3.md §2 · yeongdeok_forward_sim.json');

  rel('기상 입력의 한계',
    'ERA5는 약 5일 지연 발행되므로 위험면은 고정 기준 시각의 기상으로 계산됩니다. 순간 기상을 예보로 교체할 때의 성능 저하 상한은 측정되어 있으나, 실제 전환은 실측되지 않았습니다. 완전한 실시간 운영이 아닙니다.',
    'docs/weather_dependency.md §5');

  {
    const e1 = regEntry('dispatch_order_deadline_wins_pct');
    const e2 = regEntry('ordering_boundary_first_window_with_a_win');
    rel('부정 결과도 결과입니다 · 배차 정렬',
      '마감 임박 순 배차 정렬을 대안 3종과 비교 실측한 결과, 이길 수 있는 조건은 존재하지 않는 것으로 판정했습니다' +
      (e1 ? ' (전체 셀의 ' + e1.value + '%에서만 우세' : '') +
      (e2 ? ', 최초 승리 창 W ≥ ' + e2.value + '분, 커밋된 창은 그보다 짧음)' : ')') +
      '. 시스템이 제시하는 것은 정렬이 아니라 각 진입로가 언제 닫히는지의 계산입니다.',
      'docs/ordering_boundary.md §0',
      '이것은 경계가 아니라 모서리이며, 유효 영역이라 부를 수 있는 것이 존재하지 않습니다.');
  }

  rel('자료 결함이 판정을 얼마나 움직였는가',
    '자체 발견·정정된 두 건의 실제 자료 결함에 대해 운영 판정(출발지 분류)의 이동량을 지역별로 실측했습니다. 두 사건은 서로 다른 지역 집합을 움직였고, 증상이 관측된 지역이 판정이 움직인 지역이 아니었습니다: 결함이 보이지 않던 지역에서 90개 출발지의 판정이 바뀌었고, 결함이 보이던 지역에서는 1개였습니다.',
    'docs/decision_shift.md §1');

  rel('재현성',
    DATA.registry.n_entries + '개 등록 수치 중 ' + DATA.registry.n_reproducible +
    '개가 재현 가능합니다. 나머지는 검증되었으나 입력 자료가 소실되어 재생성할 수 없음이 기록되어 있습니다. 외부 자료는 스냅숏과 sha256으로 고정됩니다.',
    'docs/DATA_LOSS_2026-07-24.md · data/snapshots/MANIFEST.json');
}

/* ---------- presenter menu -------------------------------------------------------- */
function renderPresenter() {
  const m = $('presMenu');
  m.innerHTML = '';
  const P = T('pres');
  const add = (label, kbd, fn) => {
    const b = hel('button', null, m);
    hel('span', null, b, label);
    if (kbd) hel('span', 'kbd', b, kbd);
    b.addEventListener('click', () => { fn(); togglePres(false); });
  };
  add(P.restart, 'G', () => { setView('live'); GUIDED.start(0); });
  for (let i = 0; i < 4; i++)
    add(P.act + ' ' + (i + 1), String(i + 1),
      () => { setView('live'); GUIDED.jump(i); });
  hel('hr', 'hairline', m);
  add(P.resetAll, 'R', resetScenario);
  add(P.region, null, () => switchRegion(DATA.default_region));
  add(P.audio, 'M', () => setSound(!state.sound));
  add(P.full, 'F', toggleFullscreen);
  add(P.intro, null, showIntro);
}
function togglePres(open) {
  const menu = $('presMenu');
  const willOpen = open === undefined ? menu.hidden : open;
  menu.hidden = !willOpen;
  $('presBtn').setAttribute('aria-expanded', String(willOpen));
  if (willOpen) renderPresenter();
}
$('presBtn').addEventListener('click', () => togglePres());
function resetScenario() {
  GUIDED.exit();
  setPlaying(false);
  mountRegion(state.region);
}
function toggleFullscreen() {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(() => {});
}
function setSound(on) {
  AUDIO.setSound(on);
  $('btnSound').setAttribute('aria-pressed', String(on));
  $('btnSound').textContent = on ? T('sound_on') : T('sound_off');
}

/* ---------- intro -------------------------------------------------------------- */
let introTimer = [];
function showIntro() {
  const intro = $('intro');
  intro.hidden = false;
  intro.classList.add('live');
  $('app').classList.remove('on');
  $('introTag').textContent = T('intro_tag');
  $('iL1').textContent = T('intro_l1');
  $('iL2').textContent = T('intro_l2');
  $('iL3').textContent = T('intro_l3');
  $('iSub').textContent = T('intro_sub');
  $('introGo').textContent = T('intro_go');
  $('introExplore').textContent = T('intro_explore');
  $('skipIntro').textContent = T('intro_skip');
  // media: try video; on error fall back to terrain still
  const vid = $('introMedia');
  const fb = $('introFallback');
  vid.hidden = true; fb.hidden = true;
  const r = DATA.regions[DATA.default_region];
  const useFallback = () => {
    vid.hidden = true;
    if (r.hill) { fb.style.backgroundImage = `url(${r.hill.png})`; fb.hidden = false; }
  };
  vid.onerror = useFallback;
  vid.src = 'demo-media/intro-forest-loop.mp4';
  vid.setAttribute('poster', 'demo-media/intro-poster.webp');
  vid.oncanplay = () => { vid.hidden = false; fb.hidden = true; vid.play().catch(useFallback); };
  useFallback(); // show terrain immediately; video replaces it if it loads
  // staged lines
  const lines = intro.querySelectorAll('#introText .line');
  lines.forEach((l) => l.classList.remove('on'));
  introTimer.forEach(clearTimeout); introTimer = [];
  const delays = REDUCED ? [0, 0, 0, 0, 0] : [300, 1400, 2900, 4400, 6200];
  lines.forEach((l, i) => {
    introTimer.push(setTimeout(() => l.classList.add('on'), delays[i]));
  });
}
function hideIntro(startGuided) {
  introTimer.forEach(clearTimeout);
  const vid = $('introMedia');
  vid.pause?.(); vid.removeAttribute('src');
  $('intro').hidden = true;
  $('app').classList.add('on');
  renderTimeline();
  if (startGuided) { setView('live'); GUIDED.start(0); }
}
$('introGo').addEventListener('click', () => hideIntro(true));
$('introExplore').addEventListener('click', () => hideIntro(false));
$('skipIntro').addEventListener('click', () => hideIntro(false));

/* ---------- keyboard -------------------------------------------------------------- */
document.addEventListener('keydown', (ev) => {
  if (ev.target && /INPUT|TEXTAREA/.test(ev.target.tagName)) return;
  if (!$('intro').hidden) {
    if (ev.key === 'Escape' || ev.key === 'Enter') hideIntro(ev.key === 'Enter');
    return;
  }
  switch (ev.key) {
    case ' ': setPlaying(!state.playing); ev.preventDefault(); break;
    case 'g': case 'G': setView('live'); GUIDED.start(0); break;
    case 'r': case 'R': resetScenario(); break;
    case 'f': case 'F': toggleFullscreen(); break;
    case 'm': case 'M': setSound(!state.sound); break;
    case 'Escape':
      if (GUIDED.active()) GUIDED.exit();
      else if (!$('presMenu').hidden) togglePres(false);
      else clearSelection();
      break;
    case 'ArrowRight': if (GUIDED.active()) GUIDED.next(); break;
    case 'ArrowLeft': if (GUIDED.active()) GUIDED.prev(); break;
    case '1': case '2': case '3': case '4':
      if (state.view === 'live') GUIDED.jump(Number(ev.key) - 1);
      break;
  }
});

/* ---------- language ---------------------------------------------------------------- */
function setLang(lang) {
  state.lang = lang;
  $('btnLang').setAttribute('aria-pressed', String(lang === 'en'));
  $('btnLang').textContent = lang === 'ko' ? 'EN' : 'KO';
  $('brandSub').textContent = T('brandSub');
  $('btnGuide').textContent = T('guideBtn');
  setSound(state.sound);
  renderTabs();
  renderRegions();
  renderLegend();
  renderPanel();
  renderTransport();
  evBuilt = false; relBuilt = false; sysBuilt = false;
  if (state.view === 'system') renderSystem();
  if (state.view === 'evidence') renderEvidence();
  if (state.view === 'reliability') renderReliability();
  if (GUIDED.active()) GUIDED.jump(state.guided.act);
}
$('btnLang').addEventListener('click', () =>
  setLang(state.lang === 'ko' ? 'en' : 'ko'));
$('btnSound').addEventListener('click', () => setSound(!state.sound));
$('btnGuide').addEventListener('click', () => { setView('live'); GUIDED.start(0); });

/* ---------- boot ---------------------------------------------------------------------- */
window.addEventListener('resize', () => renderTimeline());
setLang('ko');
mountRegion(DATA.default_region);
renderTabs();
// deep links for the booth and for scripted screenshots:
//   #act1..#act4 (guided acts), #live/#system/#evidence/#reliability,
//   optional ",t=<minutes>" freezes the clock, ",region=<id>" switches first
(() => {
  const hash = decodeURIComponent(location.hash.replace('#', ''));
  if (!hash) { showIntro(); return; }
  $('intro').hidden = true;
  $('app').classList.add('on');
  const parts = hash.split(',');
  const opts = {};
  for (const p of parts.slice(1)) {
    const [k, v] = p.split('=');
    opts[k] = v;
  }
  if (opts.region && DATA.regions[opts.region]) mountRegion(opts.region);
  renderTimeline();
  const head = parts[0];
  if (/^act[1-4]$/.test(head)) {
    setView('live');
    GUIDED.start(Number(head[3]) - 1);
  } else if (VIEWS.includes(head)) {
    setView(head);
  }
  if (opts.t !== undefined) { setPlaying(false); setT(Number(opts.t) || 0); }
})();
</script>
