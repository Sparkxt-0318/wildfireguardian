<!doctype html>
<meta charset="utf-8">
<title>WildfireGuardian · 운영자 콘솔</title>
<style>
/* Vendored, not fetched. web/assets/fonts/, SIL OFL, subset to KS X 1001. */
@font-face{font-family:'IBM Plex Sans KR';font-weight:400;font-display:block;
  src:url('assets/fonts/IBMPlexSansKR-Regular.woff2') format('woff2')}
@font-face{font-family:'IBM Plex Sans KR';font-weight:600;font-display:block;
  src:url('assets/fonts/IBMPlexSansKR-SemiBold.woff2') format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-weight:400;font-display:block;
  src:url('assets/fonts/IBMPlexMono-Regular.woff2') format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-weight:600;font-display:block;
  src:url('assets/fonts/IBMPlexMono-SemiBold.woff2') format('woff2')}
/* IBM Plex has no U+2192. Measured, docs/font_measurement.json. */
@font-face{font-family:'Arrow';font-weight:400;font-display:block;
  unicode-range:U+2192,U+2191,U+2193;
  src:url('assets/fonts/Pretendard-arrow.subset.woff2') format('woff2')}
:root{
  --bg:#0b0f14; --panel:#16202b; --hair:#1f2a37;
  --ink:#e8edf2; --ink2:#94a3b8; --ink3:#7c8ba1;
  --safe:#22d3ee; --need:#f59e0b; --none:#dc2626; --over:#2563eb;
  --sans:'Arrow','IBM Plex Sans KR',system-ui,sans-serif;
  --mono:'Arrow','IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;
  display:flex;flex-direction:column;width:100vw;height:100vh}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---- status bar ---------------------------------------------------------- */
header{flex:0 0 auto;height:58px;display:flex;align-items:center;gap:0;
  border-bottom:1px solid var(--hair);background:var(--panel)}
header>div{padding:0 18px;height:100%;display:flex;align-items:center;gap:9px;
  border-right:1px solid var(--hair)}
header .k{color:var(--ink3);font-size:12px}
.badge{font-weight:600;font-size:13px;padding:4px 11px;border-radius:3px;
  background:#1e3a5f;color:#bfdbfe;white-space:nowrap}
.badge.live{background:#7f1d1d;color:#fca5a5}
#spacer{flex:1 1 auto;border-right:none}
button{font-family:var(--sans);font-size:13px;font-weight:600;cursor:pointer;
  padding:8px 15px;border-radius:3px;border:1px solid #3b82f6;
  background:#2563eb;color:#fff}
button.ghost{background:transparent;border-color:#3f5060;color:var(--ink2)}
button[disabled]{opacity:.4;cursor:not-allowed}
/* 3:1 minimum against the panel it sits on — #fbbf24 on #16202b is 8.6:1. */
:focus-visible{outline:3px solid #fbbf24;outline-offset:2px}

/* ---- main ---------------------------------------------------------------- */
main{flex:1 1 auto;display:flex;min-height:0}
#map{flex:0 0 62%;position:relative;border-right:1px solid var(--hair)}
#side{flex:1 1 38%;display:flex;flex-direction:column;min-width:0}
svg{display:block;width:100%;height:100%}

#legend{position:absolute;left:16px;bottom:16px;background:rgba(11,15,20,.92);
  border:1px solid var(--hair);border-radius:3px;padding:10px 13px;font-size:12px}
#legend .r{display:flex;align-items:center;gap:8px;margin:3px 0}
#legend .sw{width:13px;text-align:center;font-size:11px}
#bandleg{display:flex;gap:0;margin-top:8px;border-top:1px solid var(--hair);
  padding-top:8px}
#bandleg div{padding:2px 7px;font-size:11px}

/* ---- dispatch list ------------------------------------------------------- */
#sidehead{flex:0 0 auto;padding:11px 16px;border-bottom:1px solid var(--hair);
  background:var(--panel);display:flex;align-items:baseline;gap:10px}
#sidehead b{font-size:15px}
#sidehead span{color:var(--ink3);font-size:12px}
#tablewrap{flex:1 1 auto;overflow:hidden}
/* ⚠ `table-layout:fixed` is the fix for a SILENT CLIP, not a cosmetic choice.
   With auto layout the `white-space:nowrap` cells set a min-content width, so at
   1366x768 the table measured 548 px inside a 519 px pane and 29 px of the 구분
   column was cut off by `#tablewrap`'s `overflow:hidden` — no scrollbar, no
   ellipsis, just a column that stopped existing. Measured identical on the
   pre-PHASE-22 committed console, so it predated the region switcher.
   Fixed layout makes the table exactly as wide as the pane and spends the
   shortfall on the ONE column that can afford it: 위치 ellipsises, and the
   「A4 전달물에는 전부 실립니다」 line already says where the full text lives. */
table{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed}
/* ⚠ MEASURED, not chosen. Each fixed column is set to the widest content it
   actually has to hold, read off the rendered table: # 38, 남은 시간 76
   (「해당 없음」), 도보 58 (「568분」), 구분 84 (「■ 도달 불가」). 구분 was 76 first
   and ellipsised to 「■ 도달 ...」 — and that column IS the four-way answer, so
   it is the one column that must never be shortened. 위치 takes the remainder
   and is the only one allowed to ellipsise; the 「A4 전달물에는 전부 실립니다」
   line already says where the full text lives. */
th.c-n{width:38px} th.c-t{width:76px} th.c-w{width:58px} th.c-b{width:86px}
thead th{position:sticky;top:0;background:var(--panel);color:var(--ink3);
  font-size:11px;font-weight:600;text-align:left;padding:7px 10px;
  border-bottom:1px solid var(--hair)}
tbody td{padding:0 10px;height:19.5px;line-height:19.5px;border-bottom:1px solid #121a22;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
tbody tr{cursor:pointer}
tbody tr:hover{background:#1a2530}
tbody tr[aria-selected="true"]{background:#1e3a5f}
td.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
#more{flex:0 0 auto;padding:7px 10px;color:var(--ink3);font-size:12px;
  border-top:1px solid var(--hair);background:var(--panel)}
/* ⚠ An empty dispatch table reads as a broken screen. Uiseong-Andong has zero
   depots, so its responder side genuinely cannot be computed, and that has to
   be SAID rather than shown as a blank. Amber, not red: it is a property of the
   OSM data, not a failure of this run. #fde047 on #1a1206 is 14.2:1. */
#empty{flex:0 0 auto;margin:10px;padding:11px 13px;background:#1a1206;
  color:#fde047;border:1px solid #78350f;border-radius:3px;font-size:12px;
  line-height:1.6}
#empty b{display:block;font-size:13px;margin-bottom:5px}

/* ---- region switcher -------------------------------------------------------
   Buttons, not a <select>: three regions is few enough that the current one
   should be visible without opening anything, and a judge should be able to see
   that the other two exist. */
#regionpick{gap:6px}
.rbtn{font-family:var(--sans);font-size:13px;font-weight:600;cursor:pointer;
  padding:6px 12px;border-radius:3px;border:1px solid #3f5060;
  background:transparent;color:var(--ink2)}
.rbtn:hover{background:#1a2530;color:var(--ink)}
.rbtn[aria-pressed="true"]{background:#1e3a5f;border-color:#3b82f6;color:#bfdbfe}

/* ---- meta bar ------------------------------------------------------------ */
footer{flex:0 0 auto;border-top:1px solid var(--hair);background:var(--panel)}
#facts{display:flex}
#facts div{padding:7px 16px;border-right:1px solid var(--hair);font-size:12px;
  white-space:nowrap}
#facts .k{color:var(--ink3);margin-right:7px}
#standing{padding:6px 16px;background:var(--bg);color:var(--ink2);font-size:12px;
  border-top:1px solid var(--hair)}
/* The constraint a click MUST not be allowed to hide. #fde047 on #1a1206 is
   14.2:1 — it is a warning and is meant to be read, not decoration. */
#hazardnote{padding:6px 16px;background:#1a1206;color:#fde047;font-size:12px;
  border-top:1px solid var(--hair);font-weight:600}
#map{cursor:crosshair}
/* ⚠ The max-width has TWO bounds and the second one is load-bearing.
   640 px is the reading measure. `100% - 334px` keeps the banner clear of the
   photo panel on its right (286 wide + 16 offset + a 32 px gap): at 1366x768
   the map pane is 847 px, and a flat 640 put the panel straight over the end of
   the sentence — the explanation added for the refused default became
   unreadable at exactly the smallest resolution this has to work at. Above
   about 1600 the 640 still wins and nothing moves. */
#reject{position:absolute;left:16px;top:16px;padding:10px 14px;
  max-width:min(640px, calc(100% - 334px));
  background:#7f1d1d;color:#fca5a5;border:1px solid #dc2626;border-radius:3px;
  font-size:13px;line-height:1.5}
/* A PRECONDITION is not a failure. The unclicked start being outside the walk
   bbox is a standing fact about this region, shown before anything is pressed,
   so it must not wear the colours of an error the operator just caused.
   #bfdbfe on #1e3a5f is the badge pair already measured at AA. */
#reject.info{background:#1e3a5f;color:#bfdbfe;border-color:#3b82f6}

/* ---- photo EXIF panel ------------------------------------------------------
   Top-RIGHT of the map, because #reject and #legend already own the left.
   Narrow enough to leave the map readable at 1366 px, where the pane is 847. */
#photo{position:absolute;right:16px;top:16px;width:286px;
  background:rgba(11,15,20,.94);border:1px solid var(--hair);border-radius:3px;
  padding:11px 13px;font-size:12px}
#photo h2{font-size:13px;font-weight:600;margin-bottom:7px;color:var(--ink)}
#photo .hint{color:var(--ink2);margin-top:7px;line-height:1.5}
/* The processing statement is not fine print. It is smaller than the body text
   and still at 4.5:1, because a person handing over someone else's photograph
   is entitled to read what happens to it without leaning in. */
#photo .priv{color:var(--ink2);margin-top:8px;padding-top:8px;
  border-top:1px solid var(--hair);line-height:1.5}
#pickphoto{display:inline-block;width:100%;text-align:center;
  font-family:var(--sans);font-size:13px;font-weight:600;cursor:pointer;
  padding:8px 15px;border-radius:3px;border:1px solid #3b82f6;
  background:#2563eb;color:#fff}
#pickphoto:hover{background:#1d4ed8}
#photofile{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
/* Drag feedback. The whole map is the drop target: a 286 px box is a small
   thing to hit with a file, and the map is where the answer lands anyway. */
#map.drop{outline:3px dashed #3b82f6;outline-offset:-6px}
#photo .busy{color:#bfdbfe}

@media (prefers-reduced-motion: reduce){
  *{transition:none !important;animation:none !important}
}
#bar{height:3px;background:#1e3a5f;width:0}
</style>

<header>
  <div><span class="badge" id="mode">사전 계산 결과</span></div>
  <div id="regionpick" role="group" aria-label="지역 선택"></div>
  <div><span class="k">발화점</span><span class="num" id="ign"></span></div>
  <div id="progwrap" hidden><span class="k">진행</span><span id="prog">대기</span></div>
  <div id="clickwrap" hidden><span class="k" id="ptsrc">클릭 발화점</span><span class="num" id="clickpt"></span></div>
  <div id="spacer"></div>
  <div>
    <button id="run">라이브 계산 실행</button>
    <button id="cancel" class="ghost" hidden>취소</button>
  </div>
</header>
<div id="bar"></div>

<main>
  <section id="map">
    <svg id="svg" preserveAspectRatio="xMidYMid meet"
         role="img" aria-label="영덕 위험 확률장과 출발지 4구분, 대피 경로 2종"></svg>
    <div id="legend"></div>
    <div id="reject" hidden role="alert"></div>
    <div id="photo">
      <h2>신고 사진에서 좌표 읽기</h2>
      <label id="pickphoto" for="photofile" tabindex="0" role="button">사진 선택</label>
      <input id="photofile" type="file"
             accept="image/jpeg,image/png,image/heic,image/heif,.jpg,.jpeg,.png,.heic,.heif">
      <div class="hint" id="photostate">JPEG · HEIC · PNG · 지도 위로 끌어다 놓아도 됩니다.</div>
      <div class="priv" id="photoprivacy"></div>
    </div>
  </section>

  <section id="side">
    <div id="sidehead">
      <b>출동 목록</b><span id="sidesub"></span>
    </div>
    <div id="tablewrap">
      <table>
        <thead><tr>
          <th class="c-n">#</th><th>위치</th>
          <th class="c-t">남은 시간</th><th class="c-w">도보</th>
          <th class="c-b">구분</th>
        </tr></thead>
        <tbody id="rows" tabindex="0" aria-label="출동 목록. 위아래 화살표로 이동, Enter 로 지도에서 강조"></tbody>
      </table>
    </div>
    <div id="empty" hidden></div>
    <div id="more" hidden></div>
  </section>
</main>

<footer>
  <div id="facts">
    <div><span class="k">기상 자료</span><span class="num" id="f-weather"></span></div>
    <div><span class="k">보행망 커버리지</span><span class="num" id="f-cov"></span></div>
    <div><span class="k">위험면</span><span class="num" id="f-haz"></span></div>
    <div><span class="k">계산</span><span id="f-calc"></span></div>
  </div>
  <div id="hazardnote"></div>
<div id="standing"></div>
</footer>

<script id="data" type="application/json">/*__DATA__*/</script>
<script>
"use strict";
const DATA = JSON.parse(document.getElementById('data').textContent);
const SVGNS = 'http://www.w3.org/2000/svg';
const el = (id) => document.getElementById(id);

// ⚠ RUNTIME REGION SWITCHING, ONE BUILD ARTIFACT.
// All three regions are inlined in the payload above and the page swaps between
// them without touching the network. The alternative — one built file per
// region — was rejected outright: this project has already paid for "which of
// these artifacts is the current one?" once. A per-region API fetch was
// measured and also rejected (localhost round trip 0.42~0.73 ms, so latency was
// never the question) because it would make the console read a replay run
// directory AT RUNTIME, and that is exactly the thing that went missing in
// docs/api_layer.md §1.12. It would also break this file opening on its own.
//
// `D` is the CURRENT region's payload and is reassigned by mountRegion().
// Everything derived from it — the projection, the viewBox, the cell width —
// is derived again there, because the three grids differ in extent and shape.
let D = DATA.regions[DATA.default_region];
let G, SPAN, VH, CW;
let PX = (x) => x, PY = (y) => y;

function setProjection(){
  // The page does no geodesy. Everything was projected at build time by the
  // same transformer the routing used; this is a linear fit into the box.
  // Fit the viewBox to the grid's own aspect ratio. A square box would leave a
  // third of the map pane empty, and an operator reading names off a map wants
  // the pixels. Scale is uniform in both axes: distances stay comparable.
  G = D.grid;
  SPAN = G.xmax - G.xmin;
  VH = Math.round((G.ymax - G.ymin) / SPAN * 1000);
  CW = (G.cell / SPAN) * 1000;
  PX = (x) => (x - G.xmin) / SPAN * 1000;
  PY = (y) => (G.ymax - y) / SPAN * 1000;
}

function mk(tag, attrs){ const n = document.createElementNS(SVGNS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]); return n; }

const svg = el('svg');
// One group per layer, created ONCE and emptied on switch. Rebuilding the <svg>
// wholesale would drop the click listener with it.
const gHaz = mk('g', {}); svg.appendChild(gHaz);
const gBox = mk('g', {}); svg.appendChild(gBox);
const gOrig = mk('g', {}); svg.appendChild(gOrig);
const gPoi = mk('g', {}); svg.appendChild(gPoi);
const gRoute = mk('g', {}); svg.appendChild(gRoute);

// ---- hazard bands, run-length decoded --------------------------------------
function drawHazard(){
  gHaz.textContent = '';
  D.bands.forEach((runsForBand, bi) => {
    const fill = DATA.band_fills[bi];
    runsForBand.forEach(([r, c0, len]) => {
      gHaz.appendChild(mk('rect', {
        x: PX(G.xmin + c0 * G.cell), y: PY(G.ymax - r * G.cell),
        width: CW * len + .5, height: CW + .5, fill: fill,
        'fill-opacity': 0.30 + 0.16 * bi }));
    });
  });
}

// ---- walk bbox: what this region's coverage figure looks like ---------------
function drawWalkBox(){
  gBox.textContent = '';
  const [bx0, by0, bx1, by1] = D.walk_bbox;
  gBox.appendChild(mk('rect', {x: PX(bx0), y: PY(by1),
    width: PX(bx1) - PX(bx0), height: PY(by0) - PY(by1),
    fill: 'none', stroke: '#7c8ba1', 'stroke-width': 1.4,
    'stroke-dasharray': '7 5'}));
}

// ---- origins: colour AND shape ---------------------------------------------
const SHAPE = {
  circle: (x, y, s, f) => mk('circle', {cx: x, cy: y, r: s, fill: f}),
  triangle: (x, y, s, f) => mk('polygon',
    {points: `${x},${y - s * 1.2} ${x - s * 1.1},${y + s * .85} ${x + s * 1.1},${y + s * .85}`, fill: f}),
  square: (x, y, s, f) => mk('rect',
    {x: x - s * .95, y: y - s * .95, width: s * 1.9, height: s * 1.9, fill: f}),
  diamond: (x, y, s, f) => mk('polygon',
    {points: `${x},${y - s * 1.3} ${x + s * 1.3},${y} ${x},${y + s * 1.3} ${x - s * 1.3},${y}`, fill: f}),
};
const BY_KEY = {}; DATA.buckets.forEach(b => BY_KEY[b.key] = b);
function drawOrigins(origins){
  gOrig.textContent = '';
  origins.forEach(o => {
    const b = BY_KEY[o.bucket]; if (!b) return;
    gOrig.appendChild(SHAPE[b.shape](PX(o.x), PY(o.y), 3.1, b.fill));
  });
}

// ---- refuges, ignition ------------------------------------------------------
function drawPoi(){
  gPoi.textContent = '';
  D.refuges.forEach(r => gPoi.appendChild(mk('rect',
    {x: PX(r.x) - 2.4, y: PY(r.y) - 2.4, width: 4.8, height: 4.8,
     fill: 'none', stroke: '#e8edf2', 'stroke-width': 1.2})));
  gPoi.appendChild(mk('circle', {cx: PX(D.ignition[0]), cy: PY(D.ignition[1]),
    r: 7, fill: 'none', stroke: '#fde047', 'stroke-width': 2.2}));
  gPoi.appendChild(mk('circle', {cx: PX(D.ignition[0]), cy: PY(D.ignition[1]),
    r: 2.4, fill: '#fde047'}));
}

// ---- the two routes, drawn rather than asserted -----------------------------
function drawRoutes(routes){
  gRoute.textContent = '';
  (routes || []).forEach(rt => {
    const path = (pts) => pts.map(p => `${PX(p[0])},${PY(p[1])}`).join(' ');
    gRoute.appendChild(mk('polyline', {points: path(rt.naive_xy), fill: 'none',
      stroke: '#f87171', 'stroke-width': 2, 'stroke-dasharray': '6 4'}));
    gRoute.appendChild(mk('polyline', {points: path(rt.fa_xy), fill: 'none',
      stroke: '#22d3ee', 'stroke-width': 2.4}));
  });
}

// ---- the highlight ring the list drives ------------------------------------
const ring = mk('circle', {r: 11, fill: 'none', stroke: '#fde047',
  'stroke-width': 2.6, visibility: 'hidden'});
svg.appendChild(ring);

// ---- legend -----------------------------------------------------------------
function drawLegend(){
  el('legend').innerHTML =
    DATA.buckets.map(b => `<div class="r"><span class="sw" style="color:${b.fill}">${b.mark}</span>` +
      `<span>${b.ko}</span><span class="num" style="color:var(--ink3)"> ${D.counts[b.key]}</span></div>`).join('') +
    `<div class="r"><span class="sw" style="color:#fde047">◎</span><span>발화점(위험면 t=0 핵심)</span></div>` +
    `<div class="r"><span class="sw" style="color:#e8edf2">□</span><span>대피소</span></div>` +
    `<div class="r"><span class="sw" style="color:#7c8ba1">┄</span><span>보행망 범위</span></div>` +
    `<div id="bandleg">` + DATA.band_labels.map((l, i) =>
      `<div class="num" style="background:${DATA.band_fills[i]};color:#0b0f14">${l}</div>`).join('') + `</div>`;
}

// ---- dispatch list ----------------------------------------------------------
let SEL = -1;
// How many rows fit RIGHT NOW. Measured against the rendered table rather than
// assumed: a build-time row height was wrong by 1 px and silently clipped the
// last row, which is worse than an honest 「외 N곳」 line.
function rowsThatFit(){
  const wrap = el('tablewrap'), thead = document.querySelector('thead');
  const probe = document.querySelector('#rows tr');
  const rowH = probe ? probe.getBoundingClientRect().height : 20.5;
  // #more is a SIBLING of #tablewrap now, so it has its own space and this
  // only has to fit rows under the sticky header.
  const avail = wrap.getBoundingClientRect().height
              - thead.getBoundingClientRect().height;
  return Math.max(1, Math.floor(avail / rowH));
}

function renderRows(rows, limit){
  const body = el('rows'); body.textContent = '';
  const show = rows.slice(0, limit ?? rows.length);
  show.forEach((r, i) => {
    const b = BY_KEY[r.bucket] || {ko: r.bucket, fill: '#94a3b8', mark: '·'};
    const tr = document.createElement('tr');
    tr.setAttribute('role', 'row'); tr.setAttribute('aria-selected', 'false');
    tr.dataset.i = i;
    const remain = (r.closing === null || r.closing === undefined)
      ? '해당 없음' : `${r.closing.toFixed(0)}분`;
    const walk = (r.walk === null || r.walk === undefined)
      ? '-' : `${r.walk.toFixed(0)}분`;
    tr.innerHTML =
      `<td class="n">${i + 1}</td><td>${r.label ?? ''}</td>` +
      `<td class="n">${remain}</td><td class="n">${walk}</td>` +
      `<td class="b" style="color:${b.fill}">${b.mark} ${b.ko}</td>`;
    tr.addEventListener('click', () => select(i));
    body.appendChild(tr);
  });
  const more = el('more');
  const shown = show.length;
  if (rows.length > shown){
    more.hidden = false;
    more.textContent = `… 외 ${rows.length - shown}곳 · A4 전달물에는 전부 실립니다`;
  } else { more.hidden = true; }
  el('sidesub').textContent =
    `${rows.length}개 지점 · 마을 ${D.n_villages}곳 · ${shown}행 표시`;
  SEL = -1; ring.setAttribute('visibility', 'hidden');
}

// ⚠ AN EMPTY TABLE IS NOT AN ANSWER, IT IS A BLANK.
// Uiseong-Andong has zero `amenity=fire_station` mapped inside its walk bbox,
// so there is no responder-side output to show. Left as an empty table that
// reads as a broken screen, and the operator's next move would be to reload it.
// The sentence is the SERVICE's, carried through viz.json, and it is worded the
// way HANDOFF_ROUND3.md rule 11 requires: the claim is about OSM mapping inside
// one bbox, never "this region has no fire stations".
function renderResponderNote(){
  const box = el('empty'), r = D.responder;
  if (r && r.available){ box.hidden = true; return; }
  box.hidden = false;
  box.innerHTML = '';
  const h = document.createElement('b');
  h.textContent = '구조자 측 산출 없음';
  const p = document.createElement('div');
  p.textContent = (r && r.status_ko) ? r.status_ko : '';
  box.appendChild(h); box.appendChild(p);
}

function select(i){
  const body = el('rows'), rows = CURRENT.rows;
  if (i < 0 || i >= Math.min(rows.length, DATA.max_rows)) return;
  [...body.children].forEach(tr => tr.setAttribute('aria-selected', 'false'));
  const tr = body.children[i]; if (!tr) return;
  tr.setAttribute('aria-selected', 'true'); SEL = i;
  const r = rows[i];
  ring.setAttribute('cx', PX(r.x)); ring.setAttribute('cy', PY(r.y));
  ring.setAttribute('visibility', 'visible');
  tr.scrollIntoView({block: 'nearest'});
}
el('rows').addEventListener('keydown', (ev) => {
  if (ev.key === 'ArrowDown'){ ev.preventDefault(); select(SEL + 1); }
  else if (ev.key === 'ArrowUp'){ ev.preventDefault(); select(Math.max(0, SEL - 1)); }
  else if (ev.key === 'Enter' || ev.key === ' '){ ev.preventDefault(); select(SEL < 0 ? 0 : SEL); }
  else if (ev.key === 'Home'){ ev.preventDefault(); select(0); }
});

// ---- the standing facts -----------------------------------------------------
let CURRENT = {rows: D.rows, counts: D.counts, origins: D.origins};
function setCalcLabel(text){ el('f-calc').textContent = text; }

// ⚠ EVERY ONE OF THESE IS PER-REGION AND USED TO BE WRITTEN ONCE AT LOAD.
// Coverage was the literal 32.6 in the builder, which was right for Yeongdeok
// and would have been silently wrong for the other two the moment the console
// could switch. It is now read from the committed comparison table per region,
// along with the weather basis, the hazard digest and the region name inside
// the fixed-surface caution.
function renderFacts(){
  el('ign').textContent =
    `${D.ignition[0].toFixed(0)}, ${D.ignition[1].toFixed(0)} (EPSG:5179)`;
  el('f-weather').textContent = D.honesty.weather;
  el('f-cov').textContent = `${D.honesty.coverage_pct}%`;
  el('f-haz').textContent = `${D.precomputed.hazard_sha256}…`;
  el('standing').textContent = DATA.standing;
  // ⚠ Always on screen, not only after a click. Choosing an ignition point moves
  // where the ROUTING starts; it does not move the hazard surface, which was
  // simulated once for one fire and is held fixed (ERA5 publishes on a ~5-day
  // lag). Leaving this implicit invites "the prediction starts where I
  // clicked", which is not what happens.
  el('hazardnote').textContent = D.honesty.hazard_fixed;
  svg.setAttribute('aria-label',
    `${D.label_kr} 위험 확률장과 출발지 4구분, 대피 경로 2종`);
  setCalcLabel(`사전 계산 결과 · 실제 계산 ${D.precomputed.warm_total_s}초`);
}

// Two passes are not enough: pass 1 renders everything to get a row height,
// pass 2 fits — but if pass 2 turns the 「외 N곳」 line ON, that line now takes
// space the fit did not reserve and the line itself gets clipped. So iterate
// until the answer stops moving, which takes at most three passes.
function fitRows(){
  renderRows(CURRENT.rows, null);
  let limit = rowsThatFit();
  for (let pass = 0; pass < 3; pass++){
    renderRows(CURRENT.rows, limit);
    const next = rowsThatFit();
    if (next === limit) break;
    limit = next;
  }
}
window.addEventListener('resize', fitRows);

// ---- the clicked ignition point ---------------------------------------------
// The page turns a click into VIEWBOX coordinates (a matrix it already has) and
// then into projected METRES (arithmetic on the grid extent it was handed at
// build time). It stops there. Metres to degrees is a PROJECTION, and it is
// done by the server with the same pyproj transformer every committed
// coordinate came from — vendoring a JS projection library would mean trusting
// it to agree, and there would be no way to notice if it did not.
const gClick = mk('g', {}); svg.appendChild(gClick);
let CLICK = null;                       // {lon, lat} once a click is accepted

function inverseToMetres(ev){
  const pt = svg.createSVGPoint();
  pt.x = ev.clientX; pt.y = ev.clientY;
  const v = pt.matrixTransform(svg.getScreenCTM().inverse());
  return {vx: v.x, vy: v.y,
          x: G.xmin + v.x * SPAN / 1000,
          y: G.ymax - v.y * SPAN / 1000};
}

function markClick(vx, vy, ok){
  gClick.textContent = '';
  const col = ok ? '#fde047' : '#dc2626';
  gClick.appendChild(mk('circle', {cx: vx, cy: vy, r: 9, fill: 'none',
    stroke: col, 'stroke-width': 2.4}));
  gClick.appendChild(mk('line', {x1: vx - 13, y1: vy, x2: vx + 13, y2: vy,
    stroke: col, 'stroke-width': 1.4}));
  gClick.appendChild(mk('line', {x1: vx, y1: vy - 13, x2: vx, y2: vy + 13,
    stroke: col, 'stroke-width': 1.4}));
}

// `kind` is 'error' for something the operator's action caused and 'info' for a
// standing precondition. Same box, different colours and different ARIA role:
// an alert interrupts, a status does not, and a fact that is true before the
// page is touched must not interrupt.
function showReject(msg, kind){
  const r = el('reject');
  r.hidden = false; r.textContent = msg;
  const info = kind === 'info';
  r.classList.toggle('info', info);
  r.setAttribute('role', info ? 'status' : 'alert');
}
function clearReject(){ el('reject').hidden = true; }

// ---- the unclicked start, and whether it can be run at all ------------------
// ⚠ The verdict was computed at BUILD time by the same `check_in_region` the
// API gates on, so this is not a second bbox test — it is the answer, inlined.
// For yeongdeok_2025 it is NO: the field's t=0 core sits outside the walk bbox,
// so a run with no click was refused 422 every time. A button that offers a run
// the server will always refuse is worse than a disabled one, and a disabled
// one with no reason is worse than both.
// ⚠ PER REGION. Yeongdeok's t=0 core is 2,472 m outside its walk bbox and the
// other two regions' cores are inside theirs (7,384 m and 4,975 m clear,
// measured), so this gate fires for one region and not the others. It is the
// same computation for all three; nothing here is special-cased by name.
let START = D.default_start;
function applyDefaultStartGate(){
  const run = el('run');
  if (START.servable){
    run.disabled = false;
    run.textContent = '라이브 계산 실행';
    run.removeAttribute('title');
    return;
  }
  run.disabled = true;
  run.textContent = '지도를 클릭해 발화점 지정';
  run.title = START.note_ko;
  showReject(START.note_ko, 'info');
}

// ⚠ ONE PLACE WHERE A COORDINATE IS ACCEPTED OR REFUSED.
// A map click and a photograph's EXIF arrive by different routes and are the
// SAME question once a coordinate exists: is it inside the registered walk
// bbox? Both call this, so neither can grow its own wording, its own banner or
// its own idea of what is servable. `d` is the gate verdict as the server
// returned it; `sourceKo` is the only thing that differs between them.
// ⚠ AN ATTEMPT THAT PRODUCED NO COORDINATE MUST NOT LEAVE THE LAST ONE ARMED.
// Found by uploading a GPS-less photograph after a successful one: the header
// still read 「사진 발화점(EXIF) 37.5000, 127.0000」 from the PREVIOUS file while
// the banner said this photograph had no location. The operator's most recent
// intent was "use this photo"; it failed; so the point is cleared and the
// banner's own sentence 「지도를 클릭해 발화점을 지정하십시오」 is true again.
// Losing an earlier click costs one click. Running a scan from a coordinate the
// operator believes came from the photograph costs more than that.
function clearPoint(){
  CLICK = null;
  gClick.textContent = '';
  el('clickwrap').hidden = true;
  el('clickpt').textContent = '';
  el('ptsrc').textContent = '클릭 발화점';
  el('run').disabled = !START.servable;
  el('run').textContent = START.servable
    ? '라이브 계산 실행' : '지도를 클릭해 발화점 지정';
}

function applyPoint(vx, vy, d, sourceKo){
  const inGrid = d.x_5179 >= G.xmin && d.x_5179 <= G.xmax
              && d.y_5179 >= G.ymin && d.y_5179 <= G.ymax;
  markClick(vx, vy, d.inside_registered_region);
  el('clickwrap').hidden = false;
  el('ptsrc').textContent = sourceKo;
  el('clickpt').textContent = `${d.lat.toFixed(4)}, ${d.lon.toFixed(4)}`;
  if (!d.inside_registered_region){
    CLICK = null;
    el('run').disabled = true;
    // Not just disabled: RELABELLED. A greyed button still reading 「이 지점에서
    // 라이브 계산」 says the previous click is still armed when it is not.
    el('run').textContent = '지도를 클릭해 발화점 지정';
    // The service owns this sentence. The page does not compose operator
    // wording, and a refusal is SHOWN — a click that did nothing visible reads
    // as a broken screen, which is worse than a refusal.
    showReject((inGrid ? '' : '위험면 격자 밖입니다. ') + d.reason_ko);
    return false;
  }
  clearReject();
  CLICK = {lon: d.lon, lat: d.lat};
  el('run').disabled = false;
  el('run').textContent = '이 지점에서 라이브 계산';
  return true;
}

svg.addEventListener('click', async (ev) => {
  const m = inverseToMetres(ev);
  // One round trip: the server unprojects AND answers the gate.
  const r = await fetch(`/api/regions/${D.region}/locate?x=${m.x.toFixed(2)}&y=${m.y.toFixed(2)}`);
  if (!r.ok){
    markClick(m.vx, m.vy, false);
    const why = await reasonFrom(r);
    showReject(why || `좌표를 조회하지 못했습니다 (HTTP ${r.status})`);
    return;
  }
  applyPoint(m.vx, m.vy, await r.json(), '클릭 발화점');
});

// ---- a reported photograph's EXIF -------------------------------------------
// ⚠ WHAT THIS DOES NOT DO: it does not look at the picture. No landmark or
// terrain inference, no model. EXIF only. A location guessed from what is in
// the frame would be a number nobody can check, which is the one thing this
// project does not ship.
//
// ⚠ THE BYTES GO STRAIGHT OUT AND ARE NEVER HELD. The File is handed to fetch
// as the raw body: no FileReader, no data URI, no canvas, nothing that would
// put the photograph into a variable this page keeps. And no FormData, so the
// FILENAME never leaves the browser — there is no field for it to travel in.
// ⚠ ONE COPY OF THE PROCESSING STATEMENT. Inlined at build time from
// `wildfireguardian.photo.PRIVACY_KO`, never retyped, for the same reason the
// standing footer line is imported from the A4 sheet's constant: a promise about
// personal data that exists twice is a promise that can end up saying two things.
el('photoprivacy').textContent = DATA.photo_privacy_ko;

// The panel's resting line. Held as a constant because a region switch has to
// put it back: leaving 「HEIF 사진의 EXIF 에서 좌표를 읽었습니다」 on screen after
// switching would describe a photograph that belongs to the previous region.
const PHOTO_STATE_IDLE = 'JPEG · HEIC · PNG · 지도 위로 끌어다 놓아도 됩니다.';
function photoState(text, busy){
  const s = el('photostate');
  s.textContent = text;
  s.classList.toggle('busy', !!busy);
}

async function readPhoto(file){
  if (!file) return;
  photoState('사진에서 좌표를 읽는 중…', true);
  let r;
  try {
    r = await fetch(`/api/regions/${D.region}/photo-gps`,
                    {method: 'POST', body: file});
  } catch (e) {
    clearPoint();
    photoState('사진을 보내지 못했습니다. 다시 시도하십시오.');
    showReject('사진을 서버로 보내지 못했습니다. 다시 시도하십시오.');
    return;
  }
  if (!r.ok){
    const why = await reasonFrom(r);
    clearPoint();
    photoState('사진을 읽지 못했습니다.');
    showReject(why || `사진을 읽지 못했습니다 (HTTP ${r.status})`);
    return;
  }
  const d = await r.json();
  if (!d.ok){
    // EXIF 없음 · GPS 태그 없음 · 0,0 · 형식 미지원 · 손상 — each has its own
    // sentence, owned by the photo module. NEVER a silent no-op: a file that
    // was picked and produced nothing visible reads as a broken screen.
    clearPoint();
    photoState('좌표를 읽지 못했습니다.');
    showReject(d.photo_reason_ko);
    return;
  }
  const vx = PX(d.x_5179), vy = PY(d.y_5179);
  const onMap = vx >= 0 && vx <= 1000 && vy >= 0 && vy <= VH;
  const accepted = applyPoint(vx, vy, d, '사진 발화점(EXIF)');
  photoState(accepted
    ? `${d.container} 사진의 EXIF 에서 좌표를 읽었습니다.`
    : (onMap ? `${d.container} 사진에서 좌표를 읽었으나 사용할 수 없습니다.`
             : `${d.container} 사진의 좌표가 이 지도 범위 밖이라 표시할 수 없습니다.`));
}

el('photofile').addEventListener('change', (ev) => {
  const f = ev.target.files && ev.target.files[0];
  // Reset the input so picking the SAME file twice fires `change` again. A
  // second attempt that appeared to do nothing would be indistinguishable from
  // a broken button.
  readPhoto(f).finally(() => { ev.target.value = ''; });
});
// The label is focusable, so it must also activate from the keyboard.
el('pickphoto').addEventListener('keydown', (ev) => {
  if (ev.key === 'Enter' || ev.key === ' '){ ev.preventDefault(); el('photofile').click(); }
});

// Drag and drop onto the map. The default browser behaviour for a dropped image
// is to NAVIGATE AWAY to the file, which would lose the console; every one of
// these preventDefaults is load-bearing.
const mapEl = el('map');
['dragenter', 'dragover'].forEach(t => mapEl.addEventListener(t, (ev) => {
  ev.preventDefault(); mapEl.classList.add('drop');
}));
['dragleave', 'dragend'].forEach(t => mapEl.addEventListener(t, (ev) => {
  ev.preventDefault(); mapEl.classList.remove('drop');
}));
mapEl.addEventListener('drop', (ev) => {
  ev.preventDefault(); mapEl.classList.remove('drop');
  const f = ev.dataTransfer && ev.dataTransfer.files && ev.dataTransfer.files[0];
  if (f) readPhoto(f);
});
window.addEventListener('dragover', (ev) => ev.preventDefault());
window.addEventListener('drop', (ev) => ev.preventDefault());

// ---- live calculation -------------------------------------------------------
// Same-origin only. This page talks to the process that served it and to
// nothing else; there is no CDN, no tile server and no telemetry.
let JOB = null, TIMER = null;
function setBar(pct){ el('bar').style.width = `${pct}%`; }

// ⚠ A REFUSAL MUST ARRIVE AS A SENTENCE, NOT AS A NUMBER.
// The API already answers a refused submission with the Korean wording
// `service.params.check_in_region` owns; the screen used to throw it away and
// print 「제출 거절 (HTTP 422)」, which tells an operator that something was
// refused and nothing about what to do. FastAPI puts it in `detail`, which is a
// string for the refusals this app raises, an object for 409, and an array of
// validation items when pydantic rejects the body — all three are unwrapped
// here so none of them can reach the screen as `[object Object]`.
function serverReason(body){
  if (body === null || body === undefined) return '';
  const d = (typeof body === 'object' && 'detail' in body) ? body.detail : body;
  if (typeof d === 'string') return d;
  if (Array.isArray(d)){
    return d.map(x => (x && x.msg) ? x.msg : String(x)).filter(Boolean).join(' · ');
  }
  if (d && typeof d === 'object'){
    return [d.reason_ko, d.state_ko, d.error, d.detail]
      .filter(v => typeof v === 'string' && v).join(' · ');
  }
  return '';
}
async function reasonFrom(response){
  try { return serverReason(await response.json()); } catch (e) { return ''; }
}

async function poll(){
  if (!JOB) return;
  const r = await fetch(`/api/jobs/${JOB}`);
  if (!r.ok){
    const why = await reasonFrom(r);
    showReject(why || `작업 상태 조회에 실패했습니다 (HTTP ${r.status})`);
    stopLive(`조회 실패 (HTTP ${r.status})`);
    return;
  }
  const s = await r.json();
  const p = s.progress;
  el('prog').textContent = p.current_text_ko || s.state_ko;
  setBar(p.overall_pct);
  if (s.state === 'succeeded'){
    const rr = await fetch(`/api/jobs/${JOB}/result`);
    if (!rr.ok){
      const why = await reasonFrom(rr);
      showReject(why || `산출 결과를 가져오지 못했습니다 (HTTP ${rr.status})`);
      stopLive(`결과 조회 실패 (HTTP ${rr.status})`);
      return;
    }
    const res = await rr.json();
    CURRENT = {rows: (res.scan?.actionable ?? []).map(a => ({
        label: a.label, bucket: a.bucket, closing: a.closing_window_min,
        walk: a.walk_time_min, x: 0, y: 0})),
      counts: res.counts, origins: D.origins};
    el('mode').textContent = '라이브 계산 결과';
    el('mode').classList.add('live');
    setCalcLabel(`라이브 계산 · 라우팅 ${res.timings.route_s}초`);
    fitRows();
    stopLive(`완료 · ${res.n_scanned}개 출발지`);
  } else if (s.state === 'failed' || s.state === 'cancelled'){
    stopLive(s.state === 'cancelled' ? '취소됨 — 산출물 없음' : `실패: ${s.error ?? ''}`);
  } else {
    TIMER = setTimeout(poll, 700);
  }
}
function stopLive(msg){
  if (TIMER) clearTimeout(TIMER);
  TIMER = null; JOB = null;
  el('prog').textContent = msg;
  el('run').disabled = false; el('cancel').hidden = true;
  setBar(0);
}
el('run').addEventListener('click', async () => {
  // Belt and braces. The button is already disabled when the unclicked start is
  // not servable, but a keyboard activation on a stale page must not be able to
  // send a request the gate is certain to refuse.
  if (!CLICK && !START.servable){ showReject(START.note_ko, 'info'); return; }
  el('run').disabled = true; el('cancel').hidden = false;
  el('progwrap').hidden = false; el('prog').textContent = '제출 중…';
  const r = await fetch('/api/jobs', {method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({region: D.region,
                          lat: CLICK ? CLICK.lat : START.latlon[0],
                          lon: CLICK ? CLICK.lon : START.latlon[1],
                          reported_by: CLICK ? '지도 클릭' : '운영자 콘솔'})});
  if (!r.ok){
    const why = await reasonFrom(r);
    showReject(why || `계산 요청이 거절되었습니다 (HTTP ${r.status})`);
    stopLive(`제출 거절 (HTTP ${r.status})`);
    return;
  }
  clearReject();
  JOB = (await r.json()).job_id;
  poll();
});
el('cancel').addEventListener('click', async () => {
  if (!JOB) return;
  el('prog').textContent = '취소 요청…';
  await fetch(`/api/jobs/${JOB}`, {method: 'DELETE'});
});

// ---- region switching -------------------------------------------------------
// ⚠ A SWITCH IS A FULL RESET, NOT A REDRAW.
// The clicked or photographed ignition point belongs to the region it was taken
// in: a coordinate inside Yeongdeok's walk bbox is outside Uiseong-Andong's, and
// carrying it across would leave the header showing a point the new region
// cannot route from. A live result belongs to its region too, so the badge goes
// back to 「사전 계산 결과」 and the calculation label back to that region's own
// measured cost. Everything returns to that region's t=0 core.
function mountRegion(id){
  const next = DATA.regions[id];
  if (!next) return;
  if (JOB){ try { fetch(`/api/jobs/${JOB}`, {method: 'DELETE'}); } catch (e) {} }
  stopLive('대기');
  el('progwrap').hidden = true;

  D = next;
  START = D.default_start;
  CURRENT = {rows: D.rows, counts: D.counts, origins: D.origins};

  setProjection();
  svg.setAttribute('viewBox', `0 0 1000 ${VH}`);
  drawHazard(); drawWalkBox(); drawOrigins(D.origins); drawPoi();
  drawRoutes(D.routes); drawLegend();

  // Back to the pre-computed view for THIS region.
  el('mode').textContent = '사전 계산 결과';
  el('mode').classList.remove('live');
  renderFacts();
  renderResponderNote();
  fitRows();

  clearPoint();            // drops the click/photo point and re-labels the button
  clearReject();
  photoState(PHOTO_STATE_IDLE);
  applyDefaultStartGate(); // and re-raises the info note if this core is outside

  [...el('regionpick').children].forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.region === id)));
}

DATA.region_order.forEach(id => {
  const b = document.createElement('button');
  b.className = 'rbtn';
  b.type = 'button';
  b.dataset.region = id;
  b.textContent = DATA.regions[id].label_kr;
  b.setAttribute('aria-pressed', String(id === DATA.default_region));
  b.addEventListener('click', () => mountRegion(id));
  el('regionpick').appendChild(b);
});

mountRegion(DATA.default_region);
</script>
