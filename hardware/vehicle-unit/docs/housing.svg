<title id="t">WildfireGuardian vehicle unit housing</title>
<desc id="d">Front, side and top views of the roof-box concept with dimensions in millimetres: aluminium enclosure, PTFE radar radome, germanium LWIR window, copper flux plate on ceramic fibre board proud of the front face, sun and heat shield, base plate and magnet mounts. Concept, unverified.</desc>
