<title id="t">Supplied housing: front-plate layout</title>
<desc id="d">Front view and plan view of the user's printed PETG housing, drawn only from the dimensions the user gave: body 180 x 140 x 72 mm, 4 mm walls, bolt-on front plate 172 x 66 x 3 mm with a 12 mm camera hole at x = -52, a 52 x 42 mm radar window thinned to 1.2 mm at x = -8 and a 30.6 mm flux-disc hole at x = +45, all on one centre line 34 mm above the base, aluminium heat shield 10 mm in front. Documentation of the supplied housing, not a design.</desc>
