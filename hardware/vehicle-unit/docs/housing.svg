<text x="850" y="560" font-size="14" text-anchor="start" font-weight="bold" fill="#111">Notes (all values are design values, unverified)</text>
<text x="850" y="582" font-size="11" text-anchor="start" font-weight="normal" fill="#111">Radome: t = n * lambda0 / (2 * sqrt(eps_r)), lambda0 = c / 60 GHz = 5.00 mm.</text>
<text x="850" y="598.5" font-size="11" text-anchor="start" font-weight="normal" fill="#111">  polycarbonate eps_r ~ 2.9: n=1 -&gt; 1.47 mm, n=2 -&gt; 2.94 mm</text>
<text x="850" y="615" font-size="11" text-anchor="start" font-weight="normal" fill="#111">  PTFE eps_r ~ 2.1: n=1 -&gt; 1.72 mm, n=2 -&gt; 3.45 mm (drawn: PTFE n=2, 3.45 mm)</text>
<text x="850" y="631.5" font-size="11" text-anchor="start" font-weight="normal" fill="#111">  PTFE preferred near flames (PC softens near 145 C). Check loss with test B.</text>
<text x="850" y="648" font-size="11" text-anchor="start" font-weight="normal" fill="#111">LWIR window: germanium (AR 8-14 um) or chalcogenide. Glass, PC and acrylic</text>
<text x="850" y="664.5" font-size="11" text-anchor="start" font-weight="normal" fill="#111">  are opaque in LWIR. Ge transmission falls when the window runs hot.</text>
<text x="850" y="681" font-size="11" text-anchor="start" font-weight="normal" fill="#111">Flux plate: copper 50 x 50 x 1 mm, blackened (Pyromark-type, absorptivity</text>
<text x="850" y="697.5" font-size="11" text-anchor="start" font-weight="normal" fill="#111">  0.95 assumed, to be measured), on 25 mm ceramic fibre board so the</text>
<text x="850" y="714" font-size="11" text-anchor="start" font-weight="normal" fill="#111">  thin-skin (lumped) assumption holds; plate isolated from chassis.</text>
<text x="850" y="730.5" font-size="11" text-anchor="start" font-weight="normal" fill="#111">Air thermocouple: separate lead to engine-intake height, radiation-shielded.</text>
<text x="850" y="747" font-size="11" text-anchor="start" font-weight="normal" fill="#111">Shield: 1 mm Al, 20 mm air gap, 20 mm overhang; keeps sun off the lid.</text>
<text x="850" y="763.5" font-size="11" text-anchor="start" font-weight="normal" fill="#111">Mount: 4 rubber-coated magnets (steel roofs only) plus a tether strap, or</text>
<text x="850" y="780" font-size="11" text-anchor="start" font-weight="normal" fill="#111">  roof-bar clamps through the base plate. IP65/66 is a target, untested.</text>
<text x="850" y="796.5" font-size="11" text-anchor="start" font-weight="normal" fill="#111">Inside the box: Pi, IWR6843AOPEVM, 3 x MAX31855, BNO055, 12-&gt;5 V buck.</text>
<text x="850" y="813" font-size="11" text-anchor="start" font-weight="normal" fill="#111">Aluminium blocks Wi-Fi and GNSS: PC RF window on the rear face, GNSS</text>
<text x="850" y="829.5" font-size="11" text-anchor="start" font-weight="normal" fill="#111">  receiver/antenna outside on the roof.</text>
</svg>
