; WildfireGuardian field route logger firmware
; PlatformIO, Arduino framework, ESP32-S3. All versions pinned.
;   pio run -e tracker_v2             build for Heltec Wireless Tracker V2 (primary, default)
;   pio run -e tracker_v11            build for Heltec Wireless Tracker V1.1 (same-family alternate)
;   pio run -e tracker_v2 -t upload   flash (see README for macOS port/boot-mode notes)
; LittleFS is formatted automatically on first boot (no filesystem image needs uploading).

[platformio]
default_envs = tracker_v2
boards_dir = boards

[env]
; espressif32 6.9.0 bundles framework-arduinoespressif32 3.20017 (= Arduino-ESP32 core 2.0.17, ESP-IDF 4.4.7)
platform = platformio/espressif32@6.9.0
framework = arduino
board = heltec_wireless_tracker_wfg
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_upload.flash_size = 8MB
monitor_speed = 115200
monitor_filters = default
lib_deps =
  lovyan03/LovyanGFX@1.2.7
lib_ldf_mode = deep+
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -DCORE_DEBUG_LEVEL=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -Wall

[env:tracker_v11]
build_flags = ${env.build_flags} -DWFG_BOARD_HELTEC_TRACKER_V11

[env:tracker_v2]
build_flags = ${env.build_flags} -DWFG_BOARD_HELTEC_TRACKER_V2

[env:tracker_v10]
build_flags = ${env.build_flags} -DWFG_BOARD_HELTEC_TRACKER_V10

; Fallback architecture template (generic ESP32-S3 DevKitC-1 N8 + UART GNSS). Edit the board header first.
[env:generic_esp32s3]
board = esp32-s3-devkitc-1
build_flags = ${env.build_flags} -DWFG_BOARD_GENERIC_ESP32S3

; FALLBACK chosen by the sourcing lane: DFRobot FireBeetle 2 ESP32-E (classic ESP32, 4 MB) + TEL0157 GNSS + GDI TFT.
; Classic ESP32 has a USB-UART bridge (no native USB CDC), so the CDC flags are not used.
[env:fallback_fb2e]
board = dfrobot_firebeetle2_esp32e
board_build.partitions = partitions_4MB.csv
board_upload.flash_size = 4MB
build_flags =
  -std=gnu++17
  -DCORE_DEBUG_LEVEL=1
  -Wall
  -DWFG_BOARD_FIREBEETLE2_E
