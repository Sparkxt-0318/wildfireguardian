name: Research release integrity
on:
  push:
    branches: [Main]
  pull_request:
    branches: [Main]
permissions:
  contents: read
jobs:
  source-and-showcase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify copied scientific source and recorded results
        run: python tools/verify_release.py
      - name: Check showcase controls
        run: node --test demos/showcase/tests/*.test.mjs
