# WildfireGuardian — canonical parameter registry
# =============================================================================
# Round-3 infrastructure (PHASE 1-A).
#
# PURPOSE
#   Every tunable that previously lived as a literal inside scripts/ or src/ is
#   collected here so a run can be described by one hash instead of by reading
#   nine files.
#
# NON-NEGOTIABLE INVARIANT
#   The values in this file are BIT-IDENTICAL to the Round-2 submission
#   (tag `round2-submitted` = 4e9dfe3). This file MOVES parameters; it does not
#   CHANGE them. `scripts/verify_numbers.py` enforces that every value here
#   still equals the literal it was lifted from.
#
#   If you change a value here, the config_hash changes, and every number in
#   docs/NUMBERS.json that carries the old hash is thereby marked stale.
#   That is the point.
#
# LAYER DUPLICATES ARE PRESERVED, NOT UNIFIED
#   Round 2 had the same conceptual parameter living at two different values in
#   two different pipeline layers (e.g. the hazard grid is 375 m in the rescue
#   pipeline and 500 m in the routing-integration pipeline). Silently unifying
#   them would change results. They are recorded here side by side with an
#   explicit `# DUPLICATE:` marker so the divergence is visible instead of
#   buried. Resolving them is a separate, deliberate decision.
#
# PROVENANCE TAGS used in comments below:
#   [src: path:line]  the literal this value was lifted from
#   ASSUMED           literature / PoC constant, not measured
#   SYNTHETIC         labelled stand-in, not real data
#   OBSERVED          measured from a committed artifact
# =============================================================================

schema_version: 1
config_id: default
description: >-
  Round-2 submitted parameter set for the Yeongdeok 2025 held-out fire.
  Frozen reference; do not edit except through a deliberate, reported change.

# -----------------------------------------------------------------------------
# Project / geography
# -----------------------------------------------------------------------------
project:
  region_name: yeongdeok_2025      # [src: rescue.py RescueConfig.region_name]
  crs: "EPSG:5179"                 # [src: rescue.py RescueConfig.crs] Korea 2000 / Unified TM

# -----------------------------------------------------------------------------
# Seeds — THREE distinct seeds exist in the tree. All three are recorded.
# -----------------------------------------------------------------------------
seeds:
  # Canonical Build-B seed. Governs spread_v2 (the reported model) AND the
  # rescue pipeline. This is the seed printed in spread_v2_lofo.json.
  canonical: 20250603              # [src: spread_v2/model.py:36 DEFAULT_SEED]
                                   # [src: rescue.py RescueConfig.seed]
                                   # [src: scripts/calibration_metrics.py:43 CANONICAL_SEED]

  # DUPLICATE: superseded Build-A (spread_v2_xgb) seed. Retained ONLY so the
  # legacy artifact data/processed/spread_v2/lofo_metrics.json stays
  # reproducible. Not used by any reported number.
  legacy_build_a: 42               # [src: spread_v2_xgb/__init__.py:14 SEED]

  # Diagnostic-only seed; touches no reported number.
  diagnostics: 12345               # [src: scripts/diagnose_spread_warmup.py:39 SEED]

# -----------------------------------------------------------------------------
# Bounding boxes — DELIBERATELY SEPARATED (they are genuinely different extents)
# -----------------------------------------------------------------------------
bbox:
  # (1) FIRE ACQUISITION extent — the download window for ERA5 weather and ESA
  #     WorldCover fuel. Larger than the routing extent so edge cells have
  #     complete neighbourhoods.
  fire_acquisition:
    wgs84_wsen: [128.97, 36.10, 129.77, 36.90]   # [src: scripts/get_fuel.py:15 W,S,E,N]
    # CDS/ERA5 uses [North, West, South, East] — same box, different ordering.
    era5_area_nwse: [36.90, 128.97, 36.10, 129.77]  # [src: scripts/get_era5.py:20]

  # (2) ROAD / WALK NETWORK extent — the OSMnx query window and the routing
  #     extent. A STRICT SUBSET of the acquisition box above.
  #     Authoritative definition lives in utils/regions.py; verify_numbers.py
  #     asserts this copy still matches regions.lookup(region_name).bbox_wgs84.
  road_network:
    wgs84_wsen: [129.25, 36.30, 129.55, 36.60]   # [src: utils/regions.py:263 YEONGDEOK_2025]
    source_of_truth: "wildfireguardian.utils.regions.lookup('yeongdeok_2025').bbox_wgs84"

  # (3) MULTI-REGION walk bboxes (Round-3 PHASE 5).
  #
  # RULE: ignition-centred, with Yeongdeok's 0.30° x 0.30° footprint, which puts
  # every region at 919-931 km² so the density denominators are comparable.
  #
  # Yeongdeok's own bbox is NOT derived by this rule — it is the hand-drawn
  # administrative box above, kept unchanged so the committed 439/459 figures
  # stay explainable. Listed here for comparison only.
  #
  # ⚠ Equal area does NOT mean equal coverage of the fire. Measured coverage of
  # the p>=0.5 core, ON THE CANONICAL FIELD: Yeongdeok 32.6 %, Uiseong-Andong
  # 99.2 %, Uljin-Samcheok 81.5 % (docs/walk_bbox_coverage.md). Carry that
  # column into every cross-region comparison.
  #
  # ⚠ Yeongdeok is NOT re-acquired — decided 2026-08-02, re-confirmed
  # 2026-08-03. Its bbox and the simulation canvas are coupled, so re-drawing it
  # means re-simulating the hazard field and re-running canonical steps 1-3. The
  # price of not doing so is exactly one thing: every ABSOLUTE Yeongdeok rate
  # needs the 32.6 % caveat. Paired contrasts are unaffected — both arms share
  # the origins, so the sampling frame cancels. See HANDOFF_ROUND3.md §2-A.
  multi_region_walk_bbox:
    yeongdeok_2025:      [129.250, 36.300, 129.550, 36.600]   # committed, hand-drawn
    uiseong_andong_2025: [128.550, 36.200, 128.850, 36.500]   # ignition (128.70, 36.35)
    uljin_samcheok_2022: [129.170, 36.810, 129.470, 37.110]   # ignition (129.32, 36.96)

# -----------------------------------------------------------------------------
# Grid resolution
# -----------------------------------------------------------------------------
grid:
  # Rescue pipeline (run_rescue_routing.py -> the 439-origin run).
  hazard_cell_m: 375.0             # [src: rescue.py RescueConfig.hazard_cell_m]
  route_cell_m: 750.0              # [src: rescue.py RescueConfig.route_cell_m]

  # DUPLICATE: routing-integration pipeline (run_routing_integration.py -> the
  # 407-origin run) uses a 500 m hazard grid, NOT 375 m. Different value, same
  # concept. Preserved verbatim — unifying would change the 407 run.
  routing_integration_hazard_cell_m: 500.0   # [src: run_routing_integration.py:78]
  routing_integration_route_cell_m: 750.0    # [src: run_routing_integration.py:79]

  # Library defaults behind the two grid modules.
  spread_v2_default_cell_m: 500.0  # [src: spread_v2/grid.py:30 DEFAULT_CELL_M]
  spread_v2_xgb_cell_m: 375.0      # [src: spread_v2_xgb/grid.py:36 CELL_SIZE_M] (legacy Build A)

  feature_buffer_m: 6000.0         # [src: run_routing_integration.py:106]

  # ---------------------------------------------------------------------------
  # Simulation canvas — EXPLICIT, because leaving it implicit already cost us a
  # result.
  #
  # The forward simulation used to take its extent from `ev.meta.bbox_wgs84`,
  # i.e. whatever bbox happened to be sitting in data/raw/firms_data/
  # fire_manifest.json — a git-ignored file. That file was regenerated on
  # 2026-07-23 15:21 with a tighter, detection-derived bbox, and the committed
  # data/processed/routing_demo.npz (2026-07-20, sha256 5bed5026…) stopped
  # reproducing: grid 181x147 became 125x119.
  #
  # No science changed — the predicted envelope never touched either grid's
  # boundary, so the two runs differ only in canvas size (docs/grid_extent.md).
  # But the pipeline had no way to SAY that, and a silent canvas change is a
  # silent failure. So the canvas is now a stated parameter, and
  # `boundary_check` below turns clipping into a loud error.
  #
  # Default = bbox.fire_acquisition. That is a CHOICE, not a law: it is the
  # extent for which ERA5 weather and WorldCover fuel were actually downloaded,
  # so it is the largest canvas on which every input layer is real.
  simulation_bbox: fire_acquisition   # key into `bbox:` above, or an explicit
                                      # [W, S, E, N] list to override

  # ---------------------------------------------------------------------------
  # Per-region SIMULATION-GRID extension, in degrees, applied to the fire's
  # fire_manifest.json bbox. STATED HERE rather than computed in code, so the
  # canvas of every region is readable without running anything.
  #
  # WHY IT EXISTS (Round-3 PHASE 5). Both new regions' ignition points sit near
  # the southern edge of their manifest bbox, so an ignition-centred walk bbox
  # has no southern clearance: Uiseong-Andong +0.00 km, Uljin-Samcheok
  # -4.44 km — the latter's routing extent fell OUTSIDE its own hazard grid,
  # where nodes read p=0 and every origin looks safe. That is an optimistic
  # bias, so the canvas is extended rather than the bbox moved or clipped:
  # moving it north would sample away from the fire, clipping it would change
  # the density denominator. Extending the canvas biases nothing; it gives the
  # simulation the room it should have had.
  #
  # ⚠ This is a SIMULATION setting. data/raw/firms_data/fire_manifest.json is
  # the ACQUISITION record and is never edited.
  #
  # ⚠ ASYMMETRY, deliberate: Yeongdeok is NOT extended. Its grid, envelope and
  # walk bbox stay exactly as committed (docs/walk_bbox_coverage.md).
  simulation_bbox_extension:
    # degrees added to each edge of the manifest bbox; south only here.
    uiseong_andong_2025: {south: 0.05, north: 0.0, west: 0.0, east: 0.0}
    uljin_samcheok_2022: {south: 0.09, north: 0.0, west: 0.0, east: 0.0}
    yeongdeok_2025:      {south: 0.0,  north: 0.0, west: 0.0, east: 0.0}

  boundary_check:
    # Raise if the forward-simulated envelope reaches the outermost grid cells.
    # A clipped fire silently under-reports area, breadth and drift.
    enabled: true
    # Probability at/above which a boundary cell counts as "reached".
    p_threshold: 0.3
    # How many cells deep the boundary ring is.
    margin_cells: 1
    # The routing extent must sit at least this far inside the simulation grid,
    # otherwise routes can leave the hazard field and get clipped to p=0.
    # NOTE: at the current settings the eastern clearance is ~4.5 km, so this
    # check WARNS. That is the intended behaviour, not a misconfiguration —
    # see docs/grid_extent.md.
    routing_clearance_km: 5.0

    # Fraction of the predicted fire core (p >= p_cut) that the ROUTING extent
    # must actually cover.
    #
    # `routing_clearance_km` above asks "is the road network inside the hazard
    # GRID?" — Yeongdeok answers yes, with 20 km to spare. It never asked "does
    # the road network cover the FIRE?", and there Yeongdeok answers no: its
    # walk bbox spans 129.25–129.55 while the p>=0.5 envelope spans
    # 128.966–129.456, so the western 25.1 km of the predicted core has no road
    # network at all (docs/walk_bbox_coverage.md).
    #
    # Applied to Yeongdeok this check WARNS. That is correct behaviour, not a
    # misconfiguration: it is the finding.
    envelope_coverage_min: 0.80

# -----------------------------------------------------------------------------
# Time resolution
# -----------------------------------------------------------------------------
time:
  # Time-expanded routing graph discretisation.
  routing_time_step_min: 10.0      # [src: rescue.py RescueConfig.time_step_min]
                                   # [src: run_routing_integration.py:89]
                                   # [src: run_real_roads_real_hazard.py:56]

  # Forward simulation horizon: 4 steps x 3 h => 5 snapshots at t = 0..720 min.
  forward_sim_n_steps: 4           # [src: run_routing_integration.py:84]
  forward_sim_step_hours: 3.0      # [src: run_routing_integration.py:85]
  forward_sim_advance_threshold: 0.3   # [src: run_routing_integration.py:86]

  # OBSERVED in data/processed/routing_demo.npz (haz_times). The real-roads run
  # inherits this coarse 180-min cadence; the synthetic rescue hazard is 15 min.
  npz_hazard_slices_min: [0, 180, 360, 540, 720]        # OBSERVED
  synthetic_rescue_hazard_step_min: 15                  # SYNTHETIC

# -----------------------------------------------------------------------------
# Pedestrian (rural-elderly evacuee) model
# -----------------------------------------------------------------------------
pedestrian:
  elderly_flat_speed_ms: 0.7       # ASSUMED [src: evacuation.py:44 ELDERLY_FLAT_SPEED_MS]
  min_speed_ms: 0.15               # [src: evacuation.py:46 _MIN_SPEED_MS]

  # Tobler (1993) hiking function w = 6 exp(-3.5 |S + 0.05|) km/h, rescaled so
  # the flat speed equals elderly_flat_speed_ms. PHASE 2 reuses this unchanged.
  tobler_base_kmh: 6.0             # [src: evacuation.py:59]
  tobler_slope_coeff: 3.5          # [src: evacuation.py:59]
  tobler_slope_offset: 0.05        # [src: evacuation.py:59]

  # p_cut: ignition probability at/above which a location is impassable on foot.
  # --- DEM slope on OSM walk edges (Round-3 PHASE 2) -------------------------
  # Arc-length spacing at which each edge's elevation profile is sampled.
  # 60 m is the CANONICAL choice: the SRTM raster is ~25 x 31 m per pixel, and
  # sampling at or below one pixel reads DEM noise as terrain (at 30 m the
  # apparent max slope reaches 309 %). 90 m smooths real relief away. The
  # choice is load-bearing — mean traversal time rises +40.3 % at 30 m but only
  # +20.9 % at 90 m — so all three are reported (docs/slope_integration.md).
  slope_sampling_m: 60.0
  slope_sampling_sweep_m: [30.0, 60.0, 90.0]

  # Hard limit on |rise/run| per sub-segment.
  #
  # This is a DEFENCE AGAINST DEM REGISTRATION ERROR, **not a physical
  # correction**. Where a road crosses a bridge, a tunnel, or a steep cut, SRTM
  # reports the terrain surface rather than the roadbed, and the resulting
  # "slope" is an artefact of comparing a road position with a hillside
  # elevation. Clipping bounds that artefact; it does not make the value right.
  # Runs are reported with AND without clipping so its effect is visible.
  max_abs_slope: 0.60

  walk_cutoff_p: 0.5               # ASSUMED [src: rescue.py:62 DEFAULT_WALK_CUTOFF]
                                   # [src: run_routing_integration.py:87 --p-cut]
                                   # [src: run_real_roads_real_hazard.py:54 --p-cut]

  # Walk budget: how long a slow evacuee may spend before the route is a failure.
  walk_budget_min: 600.0           # ASSUMED [src: rescue.py RescueConfig.resident_time_budget_min]
                                   # [src: run_routing_integration.py:88 --time-budget-min]
                                   # [src: run_real_roads_real_hazard.py:55 --time-budget-min]

# -----------------------------------------------------------------------------
# DEM adequacy — the raster must actually cover the network it is sampled on
# -----------------------------------------------------------------------------
#
# WHY THIS EXISTS (Round-3 PHASE 5). `routing/slope.py` samples each edge's
# elevation profile from a GeoTIFF. A sample that falls OUTSIDE the raster reads
# nodata, `np.nan_to_num` turns the resulting gradient into 0, and the
# sub-segment is timed at FLAT speed. Nothing raised. Nothing logged.
#
# Uljin-Samcheok's DEM spans 36.85–37.45 N; its walk bbox starts at 36.81 N. So
# 405 of 7,300 walk nodes (5.55 %) and 2,189 of 35,492 elevation samples (6.2 %)
# were being timed flat inside a run labelled "slope". The reported bucket counts
# happened not to be contaminated — all 23 affected origins were `both_safe` —
# but that was luck, not design.
#
# This is the same failure MODE that `grid.boundary_check` was added to remove:
# an input silently not covering the thing it is applied to. Same treatment.
dem:
  # Fraction of edge elevation samples permitted to read nodata.
  #   > warn_fraction  -> loud warning, run continues
  #   > stop_fraction  -> the run STOPS (exit 5) unless the caller passes
  #                       --acknowledge-dem-gap, which is recorded in the output
  #                       so an acknowledged gap can never look like a clean run.
  nodata_warn_fraction: 0.01
  nodata_stop_fraction: 0.05

# -----------------------------------------------------------------------------
# Fuel adequacy — the WorldCover raster must cover the grid it is sampled on
# -----------------------------------------------------------------------------
#
# WHY THIS EXISTS (Round-3 PHASE 13). Same failure MODE as `dem:` above, in the
# other input layer, and worse in consequence.
#
# `spread_v2/grid.py:burnable_fraction_on_grid` reprojects the WorldCover mask
# onto the simulation grid. Where the raster does not reach, the cell reads 0 —
# and `spread_v2/features.py` gates candidacy on `burnable_frac > 0.05`, so such
# a cell is not merely given a low feature value, it is EXCLUDED FROM PREDICTION
# ENTIRELY. Nothing raised. Nothing logged.
#
# Found on miryang_2022: ESA WorldCover ships 3 x 3 degree tiles, so a crop that
# fetched only N36E126 stops dead at 129.000 E while that fire's analysis bbox
# runs to 129.05 E — the N36E129 tile was never acquired. 706 grid cells
# (176 km², 12.08 % of the grid) are LAND reading burnable_frac = 0.
#
# ⚠ THE MEASURE IS UNCOVERED **LAND**, NOT UNCOVERED AREA. A coastal bbox is
# legitimately uncovered over the sea: gangneung_2023 is 17.61 % uncovered and
# 17.2 pp of that is the East Sea, which is correct and must not trip a gate.
# Crossing the uncovered mask with the DEM separates the two causes. Measured
# across all eight manifest fires, uncovered-LAND is 0.00 % wherever the tiles
# were fully fetched and is the only reading a missing tile moves.
#
# ⚠ The committed numbers are NOT contaminated by the miryang gap: its
# easternmost detection is 128.777 E, the gap starts at 129.000 E, and the
# candidate buffer is 6 km — a 20.2 km margin. That was luck, not design, which
# is exactly why this gate now exists.
fuel:
  # Fraction of simulation-grid cells that are LAND and outside the fuel raster.
  #   > warn_fraction  -> loud warning, run continues
  #   > stop_fraction  -> the run STOPS (exit 6) unless the caller passes
  #                       --acknowledge-fuel-gap, which is recorded in the output
  #                       so an acknowledged gap can never look like a clean run.
  # Thresholds deliberately identical to `dem:` above — same failure mode, same
  # tolerance, and one number to remember instead of two.
  uncovered_land_warn_fraction: 0.01
  uncovered_land_stop_fraction: 0.05

  # ⚠ WHERE THE GATE IS, AND WHERE IT IS NOT — a stated limit, not a hidden one.
  #
  # ENFORCED in scripts/run_forward_sim_region.py, which turns fuel into a
  # committed hazard field. That is the path on which an uncovered strip reaches
  # an artifact.
  #
  # NOT ENFORCED on the LOFO training path (spread_v2/features.py:build_dataset).
  # Putting it there would drop miryang_2022 (12.08 % uncovered land) from the
  # six-fire training set and move the committed AUC — a result change disguised
  # as a guard. The MEASUREMENT is a library function (spread_v2/grid.py
  # fuel_coverage) and can be called from anywhere; what is deliberately absent
  # is the raise. Measured per fire, uncovered LAND is:
  #     yeongdeok 0.00 %, gangneung_donghae 0.00 %, goseong 0.00 %,
  #     hongseong 0.00 %, gangneung_2023 0.39 %, uljin_samcheok 0.93 %,
  #     uiseong_andong 2.05 % (warn), miryang 12.08 % (stop).
  # Whether the training path should also gate is a decision about the committed
  # model, not about this threshold.

# -----------------------------------------------------------------------------
# Responder (rescue vehicle) model
# -----------------------------------------------------------------------------
responder:
  vehicle_speed_kmh: 40.0          # ASSUMED [src: rescue.py:57 DEFAULT_VEHICLE_SPEED_KMH]
  vehicle_cutoff_p: 0.7            # ASSUMED [src: rescue.py:66 DEFAULT_VEHICLE_CUTOFF]

  # 출동 지연 — detection + mobilisation lag before the vehicle starts moving.
  dispatch_delay_min: 30.0         # ASSUMED [src: rescue.py RescueConfig.responder_dispatch_delay_min]
  safety_margin_min: 12.0          # ASSUMED [src: rescue.py RescueConfig.responder_safety_margin_min]
  time_budget_min: 75.0            # ASSUMED [src: rescue.py RescueConfig.responder_time_budget_min]
  ingress_sample_spacing_m: 150.0  # [src: rescue.py RescueConfig.ingress_sample_spacing_m]
                                   # chosen < hazard_cell_m so no cell is skipped

  # 부대 수 — depot (119안전센터 proxy) count.
  n_depots_synthetic: 2            # SYNTHETIC [src: rescue.py RescueConfig.n_synthetic_depots]
  n_depots_osm_observed: 4         # OBSERVED  data/cache/osm/depots.geojson feature count

# -----------------------------------------------------------------------------
# Population assumptions
# -----------------------------------------------------------------------------
population:
  # f — fraction of residents who cannot self-evacuate on foot at all.
  # The single most load-bearing assumption in the rescue results; the fc sweep
  # exists precisely to show what depends on it.
  immobile_fraction: 0.3           # ASSUMED [src: rescue.py RescueConfig.immobile_fraction]
  immobile_fraction_sweep: [0.15, 0.3, 0.45]   # [src: data/processed/rescue_verify_fc.json grid]
  walk_cutoff_sweep: [0.4, 0.5, 0.6]           # [src: data/processed/rescue_verify_fc.json grid]

# -----------------------------------------------------------------------------
# Origin scan strides — these set N for each run and are NOT interchangeable
# -----------------------------------------------------------------------------
origin_scan:
  rescue_stride: 3                 # [src: rescue.py RescueConfig.scan_stride]   -> N = 439
  routing_integration_stride: 4    # [src: run_routing_integration.py:90]        -> N = 407
  real_osm_stride: 18              # [src: run_real_roads_real_hazard.py:48]     -> N = 459
  sweep_max_origins: 200           # [src: rescue.py RescueConfig.sweep_max_origins]

# -----------------------------------------------------------------------------
# Synthetic hazard envelope — used ONLY when no real forward-sim field is present
# -----------------------------------------------------------------------------
synthetic_hazard:
  n_shelters: 12                   # SYNTHETIC [src: rescue.py RescueConfig.n_synthetic_shelters]
  n_inland_shelters: 8             # SYNTHETIC [src: rescue.py RescueConfig.n_synthetic_inland_shelters]
  ignition_frac: [0.46, 0.5]       # SYNTHETIC [src: rescue.py RescueConfig.syn_ignition_frac]
  base_reach_m: 2200.0             # SYNTHETIC [src: rescue.py RescueConfig.syn_fire_base_reach_m]
  reach_rate_m_per_min: 52.0       # SYNTHETIC [src: rescue.py RescueConfig.syn_fire_reach_rate_m_per_min]
  edge_width_m: 1100.0             # SYNTHETIC [src: rescue.py RescueConfig.syn_fire_edge_width_m]
  inland_flank_radius_m: 5000.0    # SYNTHETIC [src: rescue.py RescueConfig.syn_inland_flank_radius_m]

# -----------------------------------------------------------------------------
# Ignition model — CANONICAL is sklearn HistGradientBoosting (Build B).
# The xgboost path (Build A) is SUPERSEDED and must never be reported.
# -----------------------------------------------------------------------------
model:
  canonical:
    family: sklearn.ensemble.HistGradientBoostingClassifier
    loss: log_loss
    learning_rate: 0.08            # [src: spread_v2/model.py:52]
    max_iter: 300                  # [src: spread_v2/model.py:53]
    max_leaf_nodes: 31             # [src: spread_v2/model.py:54]
    min_samples_leaf: 40           # [src: spread_v2/model.py:55]
    l2_regularization: 1.0         # [src: spread_v2/model.py:56]
    early_stopping: true           # [src: spread_v2/model.py:57]
    validation_fraction: 0.15      # [src: spread_v2/model.py:58]
    class_weight: null             # deliberately NOT "balanced" — calibration over balance
    n_features: 16                 # [src: spread_v2/features.py:40 FEATURE_COLUMNS]

  # DUPLICATE / SUPERSEDED. Present for legacy reproducibility only.
  legacy_build_a_xgb:
    status: SUPERSEDED_DO_NOT_REPORT
    n_estimators: 400              # [src: spread_v2_xgb/model.py:33]
    learning_rate: 0.05            # [src: spread_v2_xgb/model.py:34]
    max_depth: 4                   # [src: spread_v2_xgb/model.py:35]
    subsample: 0.8                 # [src: spread_v2_xgb/model.py:37]
    colsample_bytree: 0.8          # [src: spread_v2_xgb/model.py:38]
    candidate_radius_m: 2000.0     # [src: spread_v2_xgb/candidates.py:32]

# -----------------------------------------------------------------------------
# Live detection pipeline (Round-3 PHASE 6)
# -----------------------------------------------------------------------------
#
# ⚠ WHAT THIS IS, AND WHAT IT IS NOT.
#
#   detection  REAL-TIME.        NASA FIRMS NRT, polled.
#   weather    NOT REAL-TIME.    ERA5 is published with roughly a five-day lag,
#                                so today's weather does not exist. The hazard
#                                surface this pipeline routes on was simulated
#                                ONCE, from the weather of the fire it was built
#                                for, and is then held FIXED.
#
# So the product is a REAL-TIME-DETECTION, PRE-COMPUTED-RISK-SURFACE decision —
# never a real-time forecast. Every screen and every artifact must say so; the
# strings that say it live in `wildfireguardian.live.scope` and are asserted by
# tests/test_live_pipeline.py.
live:
  # The registered region. A hotspot outside this bbox does not trigger.
  # Same bbox as the 459-series walk network, so a trigger can only ever fire
  # where the routing is actually defined.
  region: yeongdeok_2025

  # The pre-computed risk surface. THE CANONICAL FIELD — never routing_demo.npz,
  # which is the output of a reverted run (docs/HANDOFF_ROUND3.md §2-A).
  hazard_npz: data/processed/routing_demo_canonical.npz

  firms:
    # NRT products only. The SP (standard-processing) archives lag by ~2 months
    # and would silently turn a "live" poll into a historical one.
    sources: [VIIRS_SNPP_NRT, VIIRS_NOAA20_NRT, VIIRS_NOAA21_NRT, MODIS_NRT]
    poll_interval_min: 180.0        # 3 h — matches the VIIRS revisit cadence
    day_range: 1                    # days of NRT history per poll (API max 10)
    api_base: https://firms.modaps.eosdis.nasa.gov/api/area/csv
    timeout_s: 60.0
    retries: 3
    backoff_s: [30.0, 60.0, 120.0]  # same all-or-nothing policy as Overpass
    # Two detections within this distance are the same hotspot. VIIRS pixels are
    # ~375 m, so anything under one pixel is a re-observation, not a new fire.
    dedupe_radius_m: 375.0

  trigger:
    # Simulated/wall-clock minutes that must pass before routing runs again.
    # Without it a single overpass of 400 detections would queue 400 routing
    # runs, none of which would differ.
    retrigger_min_interval_min: 180.0
    # Below this confidence a detection does not trigger. FIRMS reports VIIRS
    # confidence as l/n/h and MODIS as 0-100; both are normalised in
    # `live.firms.confidence_rank`.
    min_confidence: nominal         # low | nominal | high
    # How far the triggering hotspot may sit from the pre-computed field's own
    # ignition point before the field stops being a statement about THIS fire.
    # Beyond it the run still completes, but every output is stamped
    # OUT_OF_SCOPE. It is a labelling threshold, never a filter.
    field_applicability_radius_km: 15.0

  replay:
    # Replay is the demo path, and it is fully offline BY CONSTRUCTION: no FIRMS
    # client is ever constructed on this branch (asserted in tests).
    default_speed: 60.0             # 60x — twelve hours in twelve minutes
    default_window_h: 12.0
    detections_csv: data/raw/firms_data/{region}_detections.csv

  output_root: outputs/live

# -----------------------------------------------------------------------------
# Paths (repo-relative)
# -----------------------------------------------------------------------------
paths:
  osm_cache_dir: data/cache/osm    # [src: rescue.py RescueConfig.osm_cache_dir]
  snapshots_dir: data/snapshots
  processed_dir: data/processed
  hazard_npz: data/processed/routing_demo.npz
  numbers_registry: docs/NUMBERS.json
