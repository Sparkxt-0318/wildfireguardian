# Vehicle profiles for the crossing decision (DESIGN.md section 8).
#
# EVERY LIMIT IN THIS FILE IS A PLACEHOLDER FOR A FIRE SERVICE TO SET.
# Dimensions are plausible generic values, not a specific make or model. dose_limit_tdu
# ((kW/m2)^(4/3) s, accumulated along the crossing by the closed-form model), max_safe_speed_m_s and
# intake_air_limit_c (engine intake air, measured by tc_air) have NOT been derived from tests, standards or
# vehicle data; they exist only so the software can run. The UI prints
# "PLACEHOLDER limits: to be set by the fire service" beside each of them. Verdicts are advisory for trained
# crews.
#
# Fields: length_m, width_m, height_m (vehicle body), sensor_height_m (roof unit above ground),
# max_safe_speed_m_s, dose_limit_tdu, intake_air_limit_c, has_water (can spray: enables SPRAY THEN RE-CHECK).

fire_engine:
  label: "Fire engine (pumper)"
  length_m: 8.5
  width_m: 2.5
  height_m: 3.3
  sensor_height_m: 3.5
  max_safe_speed_m_s: 8.3          # ~30 km/h on a smoky road; placeholder
  dose_limit_tdu: 500.0            # placeholder
  intake_air_limit_c: 80.0         # placeholder
  has_water: true
