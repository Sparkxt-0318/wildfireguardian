:root {
  --ink: #111; --muted: #555; --line: #999; --soft: #f2f2f2;
  --alert: #b00020; --alert-bg: #fde8eb; --ok: #1b5e20; --ok-bg: #e8f5e9;
  --unknown: #7a4b00; --unknown-bg: #fff3d6; --band: #ffd400;
  --model: #e8eefc; --field: #eef7ee; --road: #fff3d6;
}
* { box-sizing: border-box; }
html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
body {
  margin: 0; background: #d9d9d9; color: var(--ink);
  font-family: "KCF Noto Sans KR Subset", "Noto Sans KR", "Noto Sans CJK KR", "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", "Nanum Gothic", "WenQuanYi Zen Hei", sans-serif;
  font-size: 16px; line-height: 1.4; word-break: keep-all; overflow-wrap: anywhere;
}
.toolbar { position: sticky; top: 0; z-index: 5; background: #222; color: #fff; padding: 8px 12px; font-size: 15px; }
.tb-row { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin: 4px 0; }
.tb-title { margin-right: 8px; }
.toolbar button, .toolbar select { font: inherit; padding: 6px 10px; border-radius: 4px; border: 1px solid #888; background: #fff; color: #111; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--band); border-color: #000; font-weight: 700; }
.tb-status { color: #ccc; font-size: 13px; }
.toolbar input[type=file] { color: #ddd; font-size: 13px; max-width: 230px; }

#out { padding: 16px; }
.sheet { display: none; background: #fff; width: 210mm; max-width: 100%; min-height: 200mm; margin: 0 auto 16px; padding: 9mm 10mm; box-shadow: 0 1px 6px rgba(0,0,0,.25); }
.sheet.active, .sheet:only-child, body.static .sheet { display: block; }
.band { background: var(--band); color: #000; font-weight: 800; text-align: center; font-size: 1.05em; letter-spacing: .08em; padding: 3px 0; margin: 0 0 3mm; border: 2px solid #000; }
.hd { display: flex; justify-content: space-between; gap: 12px; border-bottom: 3px solid #000; padding-bottom: 4px; margin-bottom: 6px; }
.view-name { font-weight: 800; font-size: 1.05em; background: #000; color: #fff; display: inline-block; padding: 1px 8px; }
h1 { font-size: 1.45em; margin: 3px 0 1px; }
.sub { color: var(--muted); font-size: .85em; }
.hd-r { text-align: right; white-space: nowrap; }
.asof-l { font-size: .8em; color: var(--muted); }
.asof { font-size: 1.4em; font-weight: 800; }
.asof-prev { font-size: .8em; color: var(--muted); }

.tiles { display: grid; grid-template-columns: 1.15fr 1fr 1.15fr; gap: 8px; margin: 6px 0; }
.tile { border: 2px solid #000; padding: 4px 8px; }
.tile.alert { border-color: var(--alert); background: var(--alert-bg); }
.tile.ok { border-color: var(--ok); background: var(--ok-bg); }
.tl { font-weight: 700; font-size: .9em; }
.tv { font-size: 2.3em; font-weight: 800; line-height: 1.1; }
.tv small { font-size: .45em; margin-left: 2px; }
.tv-time { font-size: 1.6em; padding: 4px 0; }
.tn { font-size: .8em; color: var(--muted); }
.was { font-size: .8em; color: var(--muted); text-decoration: line-through; text-decoration-color: var(--alert); }
.unknown { color: var(--unknown); background: var(--unknown-bg); font-weight: 700; padding: 0 3px; }
.hot { color: var(--alert); font-weight: 800; }

.blk { margin: 6px 0; }
h2 { font-size: 1.02em; margin: 0 0 3px; border-left: 6px solid #000; padding-left: 6px; }
h3 { font-size: .9em; margin: 0 0 2px; }
h3 small { font-weight: 400; color: var(--muted); }
ul { margin: 0; padding-left: 1.2em; }
li { margin: 1px 0; }
.changes ul li { font-weight: 600; }
.changes { border: 2px solid var(--alert); padding: 4px 8px; }
.view-facility .changes { border-color: var(--line); }
.reason { font-size: .78em; color: var(--muted); margin: 3px 0 0; }
.muted { color: var(--muted); }
.small { font-size: .8em; }
.t { width: 100%; border-collapse: collapse; font-size: .88em; }
.t th, .t td { border: 1px solid var(--line); padding: 2px 5px; text-align: left; vertical-align: top; }
.t th { background: var(--soft); font-weight: 700; }
.row-open td { background: var(--alert-bg); }
.st-DELAYED, .st-UNAVAILABLE { color: var(--alert); font-weight: 800; }
.st-UNKNOWN { color: var(--unknown); font-weight: 800; }
.ds { font-size: .9em; white-space: nowrap; }
.t td [data-k$=":checked"], .t td [data-k$=":vstatus"] { white-space: nowrap; }
.ds-AWAITING_CONFIRMATION, .ds-UNKNOWN { color: var(--unknown); background: var(--unknown-bg); font-weight: 700; }
.conf .box { width: 1.4em; text-align: center; }
.chk { list-style: none; padding-left: 0; }
.chk i { color: var(--muted); font-style: normal; font-size: .9em; }
.two { display: grid; grid-template-columns: 1fr 1.3fr; gap: 10px; }
.cols3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; font-size: .85em; }
.src { padding: 4px 6px; border: 1px solid var(--line); }
.src-model { background: var(--model); }
.src-field { background: var(--field); }
.src-road { background: var(--road); }
.src i { color: var(--muted); font-style: normal; }
.handoff { border: 2px dashed #000; padding: 4px 8px; }
.handoff p { margin: 2px 0; font-size: 1.02em; line-height: 1.5; }
.prov { border-top: 2px solid #000; margin-top: 6px; padding-top: 3px; font-size: .68em; color: #333; line-height: 1.35; }
.prov-h { font-weight: 700; }
.prov code { font-size: 1em; }
.warn { color: var(--unknown); }
.disc { font-weight: 700; margin-top: 2px; }
.errs li { color: var(--alert); font-weight: 700; }
.view-error { display: block; }

@page { size: A4 portrait; margin: 8mm; }
@media print {
  body { background: #fff; font-size: 9.6pt; }
  .no-print, .toolbar { display: none !important; }
  #out { padding: 0; }
  .sheet { box-shadow: none; margin: 0; width: auto; min-height: 0; padding: 0; break-after: page; }
  .sheet:not(.active) { display: none !important; }
  body.static .sheet { display: block !important; }
  .band { margin: 0 0 1.5mm; }
  .blk { margin: 3.5px 0; }
  .tiles { margin: 4px 0; }
  .tv { font-size: 2.05em; }
  .hd { margin-bottom: 4px; }
  .prov { margin-top: 4px; }
  .density-1 { font-size: .93em; }
  .density-2 { font-size: .85em; }
  .density-3 { font-size: .78em; }
  .density-3 .tv { font-size: 1.8em; }
  .t, .blk, .tile { break-inside: avoid; }
}
@media (max-width: 700px) {
  .tiles, .cols3, .two { grid-template-columns: 1fr; }
  .hd { flex-direction: column; }
  .hd-r { text-align: left; }
}

/* generated: print rules scoped to .pm for off-screen measurement */
.pm { background: #fff; font-size: 9.6pt; }
.pm .no-print, .pm .toolbar { display: none !important; }
.pm { padding: 0; }
.pm .sheet { box-shadow: none; margin: 0; width: auto; min-height: 0; padding: 0; break-after: page; }
.pm .sheet:not(.active) { display: none !important; }
.pm.static .sheet { display: block !important; }
.pm .band { margin: 0 0 1.5mm; }
.pm .blk { margin: 3.5px 0; }
.pm .tiles { margin: 4px 0; }
.pm .tv { font-size: 2.05em; }
.pm .hd { margin-bottom: 4px; }
.pm .prov { margin-top: 4px; }
.pm .density-1 { font-size: .93em; }
.pm .density-2 { font-size: .85em; }
.pm .density-3 { font-size: .78em; }
.pm .density-3 .tv { font-size: 1.8em; }
.pm .t, .pm .blk, .pm .tile { break-inside: avoid; }

</style>
</head>

<div class="toolbar no-print" role="toolbar" aria-label="브리핑 도구">
  <div class="tb-row">

    <div class="seg" role="group" aria-label="보기 선택">

    <button type="button" id="printBtn">A4 인쇄</button>
  </div>
  <div class="tb-row">
    <label>예시 사례
      <select id="caseSel"></select>

  <div class="tb-row tb-status" id="status" aria-live="polite"></div>
</div>
<main id="out"></main>

  // ---------- 30-second spoken handoff ----------
  function speechUnits(s) {

  function buildHandoff(m) {
    var meta = m.meta, cur = m.cur, S = [];
    function add(p, t) { if (t) S.push({ p: p, t: t }); }
    add(0, '훈련 상황입니다.');
    add(0, meta.facility.short + ' ' + role(meta, 'facility') + '입니다.');
    var when = spokenT(meta, m.curAt);
    add(0, (when ? when + ' 기준, ' : '') + (m.single ? '현재 상황 보고합니다.' : '변경 사항 보고합니다.'));

        else if (p && typeof p.depart_s === 'number' && typeof t.depart_s === 'number' && t.depart_s > p.depart_s && t.vehicle_status !== 'DELAYED' && t.kind !== 'empty_return')
          add(1, v + ' 출발이 ' + spokenT(meta, p.depart_s) + '에서 ' + spokenT(meta, t.depart_s) + '으로 늦어졌습니다.');
        else if (p && p.depart_s != null && t.depart_s == null && t.vehicle_status !== 'DELAYED' && lost.indexOf(v) < 0) lost.push(v);
        else if (p && p.destination_id !== t.destination_id)
          add(1, (t.group_id ? groupSpoken(meta, cur, t.group_id) + ' ' : '') + t.people + '명 목적지를 ' + josa(dLabel(meta, t.destination_id), '으로', '로') + ' 바꿨습니다.');

    if (lost.length) add(2, lost.join(', ') + ' 출발 시각을 지금 모릅니다.');

    if (cur.unconfirmed > 0) {

      if (open.length === 1) add(1, '전체 ' + cur.people_total + '명 중 ' + open[0].group.spoken + ' ' + open[0].unconfirmed + '명이 아직 이송 수단 확정이 안 됐습니다.');
      else {
        add(1, cur.unconfirmed === cur.people_total ? '전체 ' + cur.people_total + '명 모두 아직 이송 수단 확정이 안 됐습니다.' : '전체 ' + cur.people_total + '명 중 ' + cur.unconfirmed + '명이 아직 이송 수단 확정이 안 됐습니다.');

    else add(2, '전원 하차는 계산상 ' + spokenT(meta, cur.final_unload_s) + (awaiting.length ? '인데, 수용 확인 전 값입니다.' : '입니다.'));
    if (cur.checked > 0) add(2, '배정된 ' + cur.checked + '명도 실제 탑승은 현장에서 따로 확인하겠습니다.');

<script>
(function () {
  'use strict';
  var K = window.KCFBrief;
  var state = { baseline: null, revised: null, meta: null, view: 'county', beforeOnly: false, caseKey: null };
  var out = document.getElementById('out');
  var statusEl = document.getElementById('status');

  function setStatus() {
    function one(lbl, f) { return lbl + ': ' + (f ? f.name + ' (sha256 ' + K.sha256(f.text).slice(0, 12) + ')' : '없음'); }
    statusEl.textContent = [one('기준', state.baseline), one('변경', state.beforeOnly ? null : state.revised) + (state.beforeOnly && state.revised ? ' — 변경 전 보기' : ''), one('메타', state.meta)].join('   ·   ');
  }

  function render() {
    out.innerHTML = ''; // never leave a previous brief on screen
    document.body.removeAttribute('data-rendered');
    setStatus();
    if (!state.baseline) { out.innerHTML = '<article class="sheet"><div class="band">훈련 · 가상 상황 · 실제 상황 아님</div><p>기준 JSON 을 불러오거나 예시 사례를 고르세요.</p></article>'; return; }
    var r = K.brief({
      baseline_text: state.baseline.text, baseline_name: state.baseline.name,
      revised_text: state.beforeOnly || !state.revised ? null : state.revised.text, revised_name: state.revised && state.revised.name,
      meta_text: state.meta ? state.meta.text : null, meta_name: state.meta && state.meta.name
    });
    if (!r.ok) {
      out.innerHTML = K.renderError(r.errors, r.warnings);
      document.body.setAttribute('data-rendered', 'error');
      return;
    }
    out.innerHTML = r.facility + r.county;
    fitSheets();
    document.body.setAttribute('data-rendered', 'ok');
    applyView();
  }

  // Lay each sheet out off-screen with the print rules at A4 printable size (210×297 mm minus 8 mm
  // margins) and step the density class up until it fits one page.
  function fitSheets() {
    var pm = document.createElement('div');
    pm.className = 'pm';
    pm.style.cssText = 'position:absolute;left:-10000px;top:0;width:194mm;visibility:hidden;';
    document.body.appendChild(pm);
    var probe = document.createElement('div');
    probe.style.height = '281mm';
    pm.appendChild(probe);
    var limit = probe.getBoundingClientRect().height - 8; // small safety margin
    pm.removeChild(probe);
    Array.prototype.forEach.call(out.querySelectorAll('.sheet[data-view]'), function (s) {
      var c = s.cloneNode(true);
      c.classList.add('active');
      pm.appendChild(c);
      var m = /density-(\d)/.exec(c.className), lvl = m ? Number(m[1]) : 0;
      while (c.getBoundingClientRect().height > limit && lvl < 3) {
        c.classList.remove('density-' + lvl); lvl += 1; c.classList.add('density-' + lvl);
      }
      s.className = s.className.replace(/density-\d/, 'density-' + lvl);
      s.setAttribute('data-print-fit', c.getBoundingClientRect().height <= limit ? 'one-page' : 'overflow');
      pm.removeChild(c);
    });
    document.body.removeChild(pm);
  }

  function applyView() {
    Array.prototype.forEach.call(document.querySelectorAll('[data-view-btn]'), function (b) {
      b.setAttribute('aria-pressed', b.getAttribute('data-view-btn') === state.view ? 'true' : 'false');
    });
    Array.prototype.forEach.call(out.querySelectorAll('.sheet[data-view]'), function (s) {
      s.classList.toggle('active', s.getAttribute('data-view') === state.view || s.getAttribute('data-view') === 'error');
    });
    document.title = (state.view === 'county' ? '시군 담당자용' : '시설 담당자용') + ' 이송 브리핑 (훈련용)';
  }

  function load(kind, name, text) { state[kind] = text == null ? null : { name: name, text: text }; render(); }
  function loadCase(key) {
    var c = KCF_FIXTURES[key]; state.caseKey = key;
    if (!c) return;
    state.baseline = c.baseline; state.revised = c.revised; state.meta = c.meta;
    render();
  }
  function readFile(input, kind) {
    input.addEventListener('change', function () {
      var f = input.files && input.files[0];
      if (!f) return;
      var fr = new FileReader();
      fr.onload = function () { document.getElementById('caseSel').value = ''; load(kind, f.name, String(fr.result)); input.value = ''; };
      fr.readAsText(f, 'utf-8');
    });
  }

  var sel = document.getElementById('caseSel');
  sel.innerHTML = '<option value="">— 직접 불러온 파일 —</option>' + Object.keys(KCF_FIXTURES).map(function (k) {
    return '<option value="' + K.esc(k) + '">' + K.esc(KCF_FIXTURES[k].label) + '</option>';
  }).join('');
  sel.addEventListener('change', function () { if (sel.value) loadCase(sel.value); });
  readFile(document.getElementById('fBaseline'), 'baseline');
  readFile(document.getElementById('fRevised'), 'revised');
  readFile(document.getElementById('fMeta'), 'meta');
  document.getElementById('clearRevised').addEventListener('click', function () { load('revised', null, null); });
  document.getElementById('beforeOnly').addEventListener('change', function (e) { state.beforeOnly = e.target.checked; render(); });
  document.getElementById('printBtn').addEventListener('click', function () { window.print(); });
  Array.prototype.forEach.call(document.querySelectorAll('[data-view-btn]'), function (b) {
    b.addEventListener('click', function () { state.view = b.getAttribute('data-view-btn'); applyView(); });
  });

  // URL hash: #case=delayed_vehicle&view=facility&before=1
  var h = {};
  location.hash.replace(/^#/, '').split('&').forEach(function (kv) { var p = kv.split('='); if (p[0]) h[p[0]] = decodeURIComponent(p[1] || ''); });
  if (h.view === 'facility' || h.view === 'county') state.view = h.view;
  if (h.before === '1') { state.beforeOnly = true; document.getElementById('beforeOnly').checked = true; }
  var first = h['case'] && KCF_FIXTURES[h['case']] ? h['case'] : Object.keys(KCF_FIXTURES)[0];
  sel.value = first || '';
  if (first) loadCase(first); else render();

  window.KCFViewer = {
    load: load, loadCase: loadCase, render: render, state: state,
    setView: function (v) { state.view = v; applyView(); },
    setBeforeOnly: function (b) { state.beforeOnly = !!b; document.getElementById('beforeOnly').checked = !!b; render(); }
  };
})();
