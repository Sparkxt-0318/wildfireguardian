[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wfg-latest"
version = "1.0.0"
description = "WildfireGuardian latest-forecast (c651f672) to checked-route research pipeline: export, hazard packet, re-keyed request, controlled routing and independent check"
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
packets = ["pyproj"]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["wfg_latest"]

[tool.setuptools.package-data]
wfg_latest = ["radiation/*.py", "router_validation/*.py"]
